document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ms:center;gap:var(--space-2);min-width:0;\">\n                      <i data-lucide=\"{{ subj.icon }}\" style=\"width:16px;height:16px;color:var(--color-brand-primary);flex-shrink:0;\"><\u002Fi>\n                      <span style=\"font-size:var(--text-body-sm);color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;\">{{ subj.name }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;max-width:760px;\">\n        <x-import component-from-global-scope=\"VictoriaJuniorCollegeDesignSystem_410e77.IconButton\" hint-size=\"40px,40px\" icon=\"arrow-left\" label=\"Back\" sc-camel-on-click=\"{{ goToQuizFromResults }}\"><\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:clamp(20px,5vw,48px);max-width:760px;width:100%;box-sizing:border-box;margin-top:var(--space-4);\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--space-4);padding-bottom:var(--space-6);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-6);\">\n          <div>\n            <h2 style=\"font-family:var(--font-serif-display);font-size:clamp(1.375rem,4.5vw,2.25rem);color:var(--color-text-primary);margin:0 0 var(--space-2);\">Your Results<\u002Fh2>\n            <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-2);\">\n              <sc-for list=\"{{ selectedTags }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <x-import component-from-global-scope=\"VictoriaJuniorCollegeDesignSystem_410e77.Tag\" hint-size=\"auto,32px\" active=\"{{ true }}\">{{ s.name }}<\u002Fx-import>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:var(--space-5);background:var(--cream-100);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-5);flex-wrap:wrap;justify-content:center;\">\n            <div style=\"text-align:center;\">\n              <div style=\"font-size:var(--text-caption);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--color-text-muted);\">Eligible<\u002Fdiv>\n              <div style=\"font-family:var(--font-serif-display);font-size:var(--text-h2);color:var(--color-success);\">{{ availableCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:1px;background:var(--color-border);\"><\u002Fdiv>\n            <div style=\"text-align:center;\">\n              <div style=\"font-size:var(--text-caption);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--color-text-muted);\">Locked<\u002Fdiv>\n              <div style=\"font-family:var(--font-serif-display);font-size:var(--text-h2);color:var(--color-danger);\">{{ blockedCount }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--gold-100);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-7);display:flex;gap:var(--space-4);\">\n          <div style=\"flex-shrink:0;width:36px;height:36px;border-radius:var(--radius-circle);background:var(--color-surface);display:flex;align-items:center;justify-content:center;\">\n            <i data-lucide=\"compass\" style=\"width:18px;height:18px;color:var(--gold-900);\"><\u002Fi>\n          <\u002Fdiv>\n          <div>\n            <h4 style=\"font-family:var(--font-serif-display);font-size:var(--text-h4);color:var(--color-text-primary);margin:0 0 var(--space-2);\">Guiding Principle<\u002Fh4>\n            <p style=\"margin:0 0 var(--space-2);font-size:var(--text-body);line-height:var(--leading-relaxed);color:var(--color-text-secondary);\">Don't just look at maximising your university course options when choosing your subject combination.<\u002Fp>\n            <p style=\"margin:0;font-size:var(--text-body);line-height:var(--leading-relaxed);color:var(--color-text-secondary);\">The ultimate objective is to enjoy learning and to do as well as possible at 'A' Levels - choose based on your strengths and interests.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasLocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:var(--space-6);\">\n            <h3 style=\"display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-h4);color:var(--color-text-primary);margin:0 0 var(--space-4);\">\n              <i data-lucide=\"x-circle\" style=\"width:18px;height:18px;color:var(--color-danger);\"><\u002Fi> Locked Courses\n            <\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:var(--space-2);\">\n              <sc-for list=\"{{ lockedCourses }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);\">\n                  <span style=\"font-size:var(--text-body-sm);font-weight:600;color:var(--color-text-primary);\">{{ c.name }}<\u002Fspan>\n                  <sc-if value=\"{{ showLockedReasons }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-size:var(--text-caption);color:var(--color-danger);background:var(--cream-100);padding:3px 10px;border-radius:var(--radius-pill);\">{{ c.reason }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-bottom:var(--space-6);\">\n          <h3 style=\"display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-h4);color:var(--color-text-primary);margin:0 0 var(--space-4);\">\n            <i data-lucide=\"check-circle\" style=\"width:18px;height:18px;color:var(--color-success);\"><\u002Fi> Eligible Courses\n          <\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-2);\">\n            <sc-for list=\"{{ eligibleCourses }}\" as=\"c\" hint-placeholder-count=\"10\">\n              <div style=\"display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:var(--space-2);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);\">\n                <span style=\"font-size:var(--text-body-sm);color:var(--color-text-primary);\">{{ c.name }}<\u002Fspan>\n                <x-import component-from-global-scope=\"VictoriaJuniorCollegeDesignSystem_410e77.Badge\" hint-size=\"auto,22px\" tone=\"success\">Eligible<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid var(--color-border);padding-top:var(--space-5);\">\n          <x-import component-from-global-scope=\"VictoriaJuniorCollegeDesignSystem_410e77.Button\" hint-size=\"auto,44px\" variant=\"secondary\" sc-camel-on-click=\"{{ startOver }}\" style=\"width:100%;\">\n            Start Over\n          <\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<div style=\"max-width:1200px;margin:0 auto;padding:24px 24px 48px;box-sizing:border-box\">\n  <dc-import name=\"BottomNav\" active-key=\"h2-degree-mapping-advisor\" hint-size=\"100%,200px\"><\u002Fdc-import>\n<\u002Fdiv>\n<dc-import name=\"Footer\" hint-size=\"100%,220px\"><\u002Fdc-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst SUBJECTS_DATA = [\n  { id: 'biology', name: 'Biology', icon: 'dna', requiredFor: ['Biological Sciences (NTU)', 'Environmental Studies', 'Environmental Earth Systems Science', 'Food Science & Technology', 'Chemistry & Biological Chemistry', 'Speech and Language Therapy'] },\n  { id: 'physics', name: 'Physics', icon: 'zap', requiredFor: ['Biological Sciences (NTU)', 'Food Science & Technology', 'Environmental Studies', 'Environmental Earth Systems Science', 'Industrial Design', 'Landscape Architecture', 'Computer Science (NTU)', 'Speech and Language Therapy', 'Physics / Applied Physics'] },\n  { id: 'chemistry', name: 'Chemistry', icon: 'flask-conical', requiredFor: ['Medicine', 'Dentistry', 'Process Engineering & Synthetic Chemistry', 'Food Science & Technology', 'Chemistry & Biological Chemistry', 'Biological Sciences (NTU)', 'Environmental Studies', 'Environmental Earth Systems Science', 'Speech and Language Therapy'] },\n  { id: 'mathematics', name: 'Mathematics', icon: 'calculator', requiredFor: ['Business Analytics', 'Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Computer Science (NTU)', 'Data Science & Economics / Artificial Intelligence', 'Accountancy', 'Business', 'Economics (NTU)', 'Philosophy, Politics & Economics (NTU)', 'Environmental Studies', 'Industrial Design', 'Landscape Architecture', 'Food Science & Technology', 'Chemistry & Biological Chemistry', 'Speech and Language Therapy', 'Physics / Applied Physics'] },\n  { id: 'economics', name: 'Economics', icon: 'trending-up', requiredFor: ['Accountancy', 'Business', 'Economics (NTU)', 'Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Environmental Studies', 'Environmental Earth Systems Science', 'Industrial Design', 'Landscape Architecture', 'Speech and Language Therapy'] },\n  { id: 'further-math', name: 'Further Mathematics', icon: 'sigma', requiredFor: ['Business Analytics', 'Food Science & Technology'] },\n  { id: 'computing', name: 'Computing', icon: 'monitor', requiredFor: ['Computer Science (NTU)', 'Food Science & Technology', 'Environmental Earth Systems Science'] },\n  { id: 'literature', name: 'Literature', icon: 'book-open', requiredFor: ['Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Environmental Studies', 'Accountancy', 'Business', 'Economics (NTU)', 'Industrial Design', 'Landscape Architecture'] },\n  { id: 'history', name: 'History', icon: 'landmark', requiredFor: ['Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Environmental Studies', 'Accountancy', 'Business', 'Economics (NTU)', 'Industrial Design', 'Landscape Architecture'] },\n  { id: 'geography', name: 'Geography', icon: 'globe', requiredFor: ['Environmental Studies', 'Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Accountancy', 'Business', 'Economics (NTU)'] },\n  { id: 'arts', name: 'Art/CLL/CSE/TSD/TLL', icon: 'palette', requiredFor: ['Industrial Design', 'Landscape Architecture', 'Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Environmental Studies', 'Accountancy', 'Business', 'Economics (NTU)'] }\n];\n\nconst VALID_COMBINATIONS = [\n  { id: 'pcm', subjectIds: ['physics', 'chemistry', 'mathematics'], category: 'Science' },\n  { id: 'bcm', subjectIds: ['biology', 'chemistry', 'mathematics'], category: 'Science' },\n  { id: 'pme', subjectIds: ['physics', 'mathematics', 'economics'], category: 'Science' },\n  { id: 'cme', subjectIds: ['chemistry', 'mathematics', 'economics'], category: 'Science' },\n  { id: 'bme', subjectIds: ['biology', 'mathematics', 'economics'], category: 'Science' },\n  { id: 'pmfm', subjectIds: ['physics', 'mathematics', 'further-math'], category: 'Science' },\n  { id: 'pcompm', subjectIds: ['physics', 'computing', 'mathematics'], category: 'Science' },\n  { id: 'ccompm', subjectIds: ['chemistry', 'computing', 'mathematics'], category: 'Science' },\n  { id: 'lit-hist-arts', subjectIds: ['literature', 'history', 'arts'], category: 'Humanities' },\n  { id: 'lit-hist-econ', subjectIds: ['literature', 'history', 'economics'], category: 'Humanities' },\n  { id: 'lit-geog-arts', subjectIds: ['literature', 'geography', 'arts'], category: 'Humanities' },\n  { id: 'lit-geog-econ', subjectIds: ['literature', 'geography', 'economics'], category: 'Humanities' },\n  { id: 'lit-econ-arts', subjectIds: ['literature', 'economics', 'arts'], category: 'Humanities' },\n  { id: 'hist-econ-arts', subjectIds: ['history', 'economics', 'arts'], category: 'Humanities' },\n  { id: 'geog-econ-arts', subjectIds: ['geography', 'economics', 'arts'], category: 'Humanities' }\n];\n\nconst UNIVERSAL_COURSES = ['Economics (NUS)', 'Architecture (SUTD)', 'Environmental Studies', 'Accountancy', 'Business', 'Economics (NTU)', 'Philosophy, Politics & Economics (NUS)', 'Law', 'Architecture (NUS)', 'Humanities Arts & Social Sciences', 'Maritime Studies', 'NIE (Arts/Science/Sport Science & Management)', 'Communication Studies'];\n\nconst ALL_DEFINED_COURSES = [\n  'Law', 'Nursing', 'Architecture (NUS)', 'Engineering (NUS)', 'Engineering (NTU)', 'Robotics', 'Physics / Applied Physics', 'Industrial Design', 'Landscape Architecture', 'Business Analytics',\n  'Common Computer Science Programmes (NUS)', 'Information Security', 'Business Artificial Intelligence Systems', 'Computer Engineering (NUS)', 'Computer Engineering (NTU)', 'Computer Science (NTU)',\n  'Data Science & Economics / Artificial Intelligence', 'Environmental Studies', 'Food Science & Technology', 'Humanities Arts & Social Sciences',\n  'Biological Sciences (NTU)', 'Life Sciences', 'Chemistry & Biological Chemistry', 'Environmental Earth Systems Science', 'Philosophy, Politics & Economics (NTU)', 'Philosophy, Politics & Economics (NUS)', 'Accountancy',\n  'Business', 'Economics (NTU)', 'Maritime Studies', 'NIE (Arts/Science/Sport Science & Management)', 'Communication Studies', 'Medicine', 'Pharmacy', 'Dentistry',\n  'Process Engineering & Synthetic Chemistry', 'Pharmaceutical Sciences', 'Dietetics and Nutrition', 'Diagnostic Radiography',\n  'Physiotherapy', 'Occupational Therapy', 'Radiation Therapy (intakes every 2 years)', 'Speech and Language Therapy', 'Economics (NUS)', 'Architecture (SUTD)'\n];\n\nclass Component extends DCLogic {\n  state = { screen: 'intro', selectedCombId: null };\n\n  componentDidMount() {\n    this.refreshIcons();\n    setTimeout(() => this.refreshIcons(), 300);\n    window.addEventListener('load', this.refreshIcons);\n  }\n  componentDidUpdate() { this.refreshIcons(); }\n  componentWillUnmount() { window.removeEventListener('load', this.refreshIcons); }\n  refreshIcons = () => { if (window.lucide) window.lucide.createIcons(); };\n\n  computeResults(selectedSubjects) {\n    if (selectedSubjects.size === 0) return [];\n    const results = [];\n    const has = (id) => selectedSubjects.has(id);\n    const hasPCM = has('physics') && has('chemistry') && has('mathematics');\n\n    ALL_DEFINED_COURSES.forEach(course => {\n      if (course === 'Life Sciences') {\n        if (has('biology') && has('chemistry')) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Biology AND Chemistry' });\n        return;\n      }\n      if (UNIVERSAL_COURSES.includes(course) || hasPCM) { results.push({ name: course, isAvailable: true }); return; }\n      if (course === 'Medicine' || course === 'Dentistry') {\n        if (has('chemistry') && (has('biology') || has('physics'))) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Chemistry AND (Biology or Physics)' });\n        return;\n      }\n      if (course === 'Process Engineering & Synthetic Chemistry') {\n        if (has('mathematics') && has('chemistry')) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Mathematics AND Chemistry' });\n        return;\n      }\n      if (course === 'Chemistry & Biological Chemistry') {\n        if (has('chemistry') && (has('mathematics') || has('physics'))) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Chemistry AND (Mathematics or Physics)' });\n        return;\n      }\n      if (course === 'Pharmacy' || course === 'Pharmaceutical Sciences') {\n        if (has('chemistry') && (has('biology') || has('physics') || has('mathematics') || has('further-math'))) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Chemistry AND (Bio, Physics, Math or FM)' });\n        return;\n      }\n      if (course === 'Engineering (NTU)' || course === 'Computer Engineering (NTU)') {\n        if (has('mathematics') && (has('physics') || has('chemistry') || has('biology') || has('computing'))) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires H2 Mathematics AND (Physics, Chem, Bio or Computing)' });\n        return;\n      }\n      if (course === 'Robotics') {\n        if (has('mathematics') && (has('physics') || has('chemistry') || has('biology') || has('computing'))) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Mathematics AND (Physics, Chem, Bio or Comp)' });\n        return;\n      }\n      if (course === 'Engineering (NUS)' || course === 'Computer Engineering (NUS)') {\n        if (has('mathematics') || has('further-math')) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires H2 Mathematics or Further Mathematics' });\n        return;\n      }\n      if (course === 'Food Science & Technology') {\n        const count = ['chemistry', 'biology', 'physics', 'computing', 'mathematics', 'further-math'].filter(has).length;\n        if (count >= 2) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires any 2 of: Chem, Bio, Physics, Computing, Math, FM (H2)' });\n        return;\n      }\n      if (course === 'Physics / Applied Physics') {\n        if (has('physics') && has('mathematics')) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires Physics AND Mathematics' });\n        return;\n      }\n      if (course === 'Nursing') {\n        const count = ['biology', 'chemistry', 'computing', 'physics', 'mathematics'].filter(has).length;\n        if (count >= 2) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires any 2 of: Bio, Chem, Comp, Phy, Math' });\n        return;\n      }\n      if (['Diagnostic Radiography', 'Dietetics and Nutrition', 'Physiotherapy', 'Radiation Therapy (intakes every 2 years)'].includes(course)) {\n        const count = ['biology', 'chemistry', 'physics', 'mathematics'].filter(has).length;\n        if (count >= 2) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Requires any 2 of: Bio, Chem, Physics, Math (H2)' });\n        return;\n      }\n      if (course === 'Occupational Therapy' || course === 'Speech and Language Therapy') {\n        if (['biology', 'chemistry', 'physics', 'mathematics', 'economics'].some(has)) results.push({ name: course, isAvailable: true });\n        else results.push({ name: course, isAvailable: false, reason: 'Needs a good pass in Bio, Chem, Physics, Math or Econ (a good H1 Math pass also counts)' });\n        return;\n      }\n      const requiredSubjects = SUBJECTS_DATA.filter(s => s.requiredFor.includes(course));\n      if (requiredSubjects.some(s => has(s.id))) results.push({ name: course, isAvailable: true });\n      else {\n        const reqNames = requiredSubjects.map(s => s.name).join(' or ');\n        results.push({ name: course, isAvailable: false, reason: `Requires: ${reqNames || 'Specific H2'}` });\n      }\n    });\n    return results.sort((a, b) => a.isAvailable === b.isAvailable ? a.name.localeCompare(b.name) : (a.isAvailable ? 1 : -1));\n  }\n\n  buildCombos(category, selectedCombId) {\n    return VALID_COMBINATIONS.filter(c => c.category === category).map(combo => {\n      const isSelected = combo.id === selectedCombId;\n      return {\n        id: combo.id,\n        isSelected,\n        bg: isSelected ? 'var(--cream-100)' : 'var(--color-surface)',\n        border: isSelected ? 'var(--color-brand-primary)' : 'var(--color-border)',\n        shadow: isSelected ? 'var(--shadow-md)' : 'var(--shadow-sm)',\n        subjects: combo.subjectIds.map(id => SUBJECTS_DATA.find(s => s.id === id)).filter(Boolean),\n        select: () => this.setState({ selectedCombId: combo.id, screen: 'results' }),\n      };\n    });\n  }\n\n  renderVals() {\n    const { screen, selectedCombId } = this.state;\n    const comb = VALID_COMBINATIONS.find(c => c.id === selectedCombId);\n    const selectedSubjects = comb ? new Set(comb.subjectIds) : new Set();\n    const results = this.computeResults(selectedSubjects);\n    const availableCount = results.filter(r => r.isAvailable).length;\n    const blockedCount = results.length - availableCount;\n    const selectedTags = SUBJECTS_DATA.filter(s => selectedSubjects.has(s.id));\n\n    return {\n      isIntro: screen === 'intro',\n      isQuiz: screen === 'quiz',\n      isResults: screen === 'results',\n      goToQuiz: () => this.setState({ screen: 'quiz' }),\n      goBack: () => this.setState({ screen: 'intro' }),\n      goToQuizFromResults: () => this.setState({ screen: 'quiz' }),\n      startOver: () => this.setState({ screen: 'intro', selectedCombId: null }),\n      dataYear: this.props.dataYear ?? '2026',\n      sciCombos: this.buildCombos('Science', selectedCombId),\n      humCombos: this.buildCombos('Humanities', selectedCombId),\n      selectedTags,\n      availableCount,\n      blockedCount,\n      hasLocked: blockedCount > 0,\n      showLockedReasons: this.props.showLockedReasons ?? true,\n      lockedCourses: results.filter(r => !r.isAvailable),\n      eligibleCourses: results.filter(r => r.isAvailable),\n      year: new Date().getFullYear(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
