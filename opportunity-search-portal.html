document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;box-sizing:border-box\">\n  <dc-import name=\"BottomNav\" active-key=\"opportunity-search-portal\" hint-size=\"100%,200px\"><\u002Fdc-import>\n<\u002Fdiv>\n<dc-import name=\"Footer\" hint-size=\"100%,220px\"><\u002Fdc-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;groupsSheetUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;}}\">\n\nconst GROUPS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQljtaq_7vheqd56NZ7gb-GiRYdeAg3pqfImXJtG1hUCDdvLgGR7Nypb6_iZ6eDCszlVu8qu0n2Awzy/pub?gid=470211783&single=true&output=csv';\n\n\nconst GCAL_MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, sept:9, oct:10, nov:11, dec:12 };\nfunction gcMonth(w) { return GCAL_MONTHS[String(w || '').toLowerCase().slice(0, 4)] || GCAL_MONTHS[String(w || '').toLowerCase().slice(0, 3)] || 0; }\nfunction gcPad(n) { return String(n).padStart(2, '0'); }\nfunction gcYmd(y, m, d) { return '' + y + gcPad(m) + gcPad(d); }\nfunction gcNextDay(y, m, d) { const t = new Date(Date.UTC(y, m - 1, d + 1)); return gcYmd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }\n// Returns { y, m, d, endY, endM, endD } for the first date (or range) in a cell, or null.\nfunction gcParseDate(str) {\n  const s = String(str || '').split(/;|\\|/)[0].trim();\n  if (!s || s === '-' || s === '—') return null;\n  let x = s.match(/([A-Za-z]{3,})\\s+(\\d{1,2})(?:\\s*[-–]\\s*(\\d{1,2}))?,?\\s+(\\d{4})/);\n  if (x && gcMonth(x[1])) { const m = gcMonth(x[1]), y = +x[4]; return { y, m, d: +x[2], endY: y, endM: m, endD: x[3] ? +x[3] : +x[2] }; }\n  x = s.match(/(\\d{1,2})\\s*[-–]\\s*(\\d{1,2})\\s+([A-Za-z]{3,})\\s+(\\d{4})/);\n  if (x && gcMonth(x[3])) { const m = gcMonth(x[3]), y = +x[4]; return { y, m, d: +x[1], endY: y, endM: m, endD: +x[2] }; }\n  x = s.match(/(\\d{1,2})\\s+([A-Za-z]{3,})\\s*[-–]\\s*(\\d{1,2})\\s+([A-Za-z]{3,})\\s+(\\d{4})/);\n  if (x && gcMonth(x[2]) && gcMonth(x[4])) { const y = +x[5]; return { y, m: gcMonth(x[2]), d: +x[1], endY: y, endM: gcMonth(x[4]), endD: +x[3] }; }\n  x = s.match(/(\\d{1,2})[^A-Za-z]*?([A-Za-z]{3,})[^\\d]*(?:.*?)(\\d{4})/);\n  if (x && gcMonth(x[2])) { const m = gcMonth(x[2]), y = +x[3]; return { y, m, d: +x[1], endY: y, endM: m, endD: +x[1] }; }\n  return null;\n}\n// Returns { sh, sm, eh, em } in 24h, or null when the timing isn't a clear time range.\nfunction gcParseTime(str) {\n  const s = String(str || '').replace(/\\s+/g, ' ').trim();\n  if (!s || /\\|/.test(s)) return null;\n  const to24 = (h, ap) => { h = +h % 12; return /p/i.test(ap) ? h + 12 : h; };\n  let x = s.match(/(\\d{1,2})(?:[:.](\\d{2}))?\\s*(AM|PM)?\\s*(?:-|–|to)\\s*(\\d{1,2})(?:[:.](\\d{2}))?\\s*(AM|PM)/i);\n  if (x) {\n    const eh = to24(x[4], x[6]), em = +(x[5] || 0);\n    let sh = to24(x[1], x[3] || x[6]); const smin = +(x[2] || 0);\n    if (!x[3] && (sh * 60 + smin) >= (eh * 60 + em)) sh = to24(x[1], 'AM');\n    return { sh, sm: smin, eh, em };\n  }\n  x = s.match(/(?:from\\s*)?(\\d{1,2})(?:[:.](\\d{2}))?\\s*(AM|PM)/i);\n  if (x) { const sh = to24(x[1], x[3]), sm = +(x[2] || 0); return { sh, sm, eh: Math.min(sh + 2, 23), em: sm }; }\n  return null;\n}\nfunction gcalUrl({ title, date, timing, details, location }) {\n  const d = gcParseDate(date);\n  if (!d) return '';\n  const multi = d.endD !== d.d || d.endM !== d.m;\n  const t = multi ? null : gcParseTime(timing);\n  const dates = t\n    ? gcYmd(d.y, d.m, d.d) + 'T' + gcPad(t.sh) + gcPad(t.sm) + '00/' + gcYmd(d.y, d.m, d.d) + 'T' + gcPad(t.eh) + gcPad(t.em) + '00'\n    : gcYmd(d.y, d.m, d.d) + '/' + gcNextDay(d.endY, d.endM, d.endD);\n  const p = new URLSearchParams({ action: 'TEMPLATE', text: title, dates, ctz: 'Asia/Singapore' });\n  if (details) p.set('details', details.slice(0, 1500));\n  if (location && location !== '-') p.set('location', location);\n  return 'https://calendar.google.com/calendar/render?' + p.toString();\n}\n\nclass Component extends DCLogic {\n  state = {\n    allOpportunities: [],\n    uniqueTypes: [], uniqueLevels: [], uniqueSubjects: [],\n    searchQuery: '',\n    activeTypes: [], activeLevels: [], activeSubjects: [],\n    currentTab: 'upcoming',\n    groups: [], groupsRaw: [], groupsStatus: 'none',\n    viewFormat: 'grid',\n    sortColumn: 'eventDate', sortOrder: 'asc',\n    modalOpen: false, modalOppRaw: null,\n    isLoading: true, isRefreshing: false,\n    lastUpdated: null, lastUpdatedLabel: 'Live',\n  };\n\n  componentDidMount() {\n    this.loadData();\n    this.loadGroups();\n    this._poll = setInterval(() => { this.loadData(true); this.loadGroups(); }, 60 * 1000);\n    this._tick = setInterval(() => this.refreshTick(), 15 * 1000);\n    this._iconTimer = setInterval(() => { if (window.lucide) window.lucide.createIcons(); }, 400);\n    this._onVisible = () => { if (document.visibilityState === 'visible') this.loadData(true); };\n    document.addEventListener('visibilitychange', this._onVisible);\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (window.lucide) window.lucide.createIcons();\n    if (prevState && prevState.uniqueSubjects !== this.state.uniqueSubjects && (this.state.groupsRaw || []).length) this.mapGroupIndustries();\n  }\n  componentWillUnmount() {\n    clearInterval(this._poll); clearInterval(this._tick); clearInterval(this._iconTimer);\n    document.removeEventListener('visibilitychange', this._onVisible);\n  }\n\n  refreshTick() {\n    if (!this.state.lastUpdated) return;\n    const secs = Math.floor((Date.now() - this.state.lastUpdated.getTime()) / 1000);\n    let label;\n    if (secs < 45) label = 'Updated just now';\n    else if (secs < 3600) label = 'Updated ' + Math.floor(secs / 60) + 'm ago';\n    else label = 'Updated ' + this.state.lastUpdated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });\n    this.setState({ lastUpdatedLabel: label });\n  }\n\n  refreshNow() { if (!this.state.isRefreshing) this.loadData(true); }\n\n  async fetchWithTimeout(url, ms) {\n    const ctrl = new AbortController();\n    const t = setTimeout(() => ctrl.abort(), ms);\n    try { return await fetch(url, { cache: 'no-store', signal: ctrl.signal }); }\n    finally { clearTimeout(t); }\n  }\n\n  async fetchCSV(url) {\n    // Google's published-CSV redirect often omits CORS headers on real domains; try direct, then CORS-safe proxies in sequence.\n    try {\n      const resp = await this.fetchWithTimeout(url, 6000);\n      const text = await resp.text();\n      if (text && !text.trim().startsWith('<')) return text;\n      throw new Error('non-csv response');\n    } catch (e) {\n      const proxies = [\n        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),\n        'https://corsproxy.io/?url=' + encodeURIComponent(url),\n        'https://r.jina.ai/' + url\n      ];\n      for (const p of proxies) {\n        try {\n          const r = await this.fetchWithTimeout(p, 7000);\n          const text = await r.text();\n          if (text && !text.trim().startsWith('<')) return text;\n        } catch (e2) { /* try next proxy */ }\n      }\n      throw new Error('All CSV fetch attempts failed');\n    }\n  }\n\n  // Community sheet uses short labels (e.g. \"Healthcare\", \"Finance\"); fold them into the\n  // main sheet's Industry Interest categories so the dropdown has one entry per industry.\n  mapGroupIndustries() {\n    const raw = this.state.groupsRaw || [];\n    const cats = this.state.uniqueSubjects || [];\n    const ALIAS = { economics: 'business', government: 'public service', policy: 'public service', medicine: 'healthcare', medical: 'healthcare', health: 'healthcare', tech: 'computing', technology: 'computing', it: 'computing', research: 'science', environment: 'sustainability', media: 'media', arts: 'arts', design: 'arts' };\n    const toCat = (label) => {\n      const l = label.toLowerCase().trim();\n      if (!cats.length) return label;\n      const exact = cats.find(c => c.toLowerCase() === l);\n      if (exact) return exact;\n      const word = cats.find(c => c.toLowerCase().split(/\\s*&\\s*|\\s+and\\s+|\\s*\\(|\\)/).map(x => x.trim()).includes(l));\n      if (word) return word;\n      const key = ALIAS[l];\n      if (key) { const hit = cats.find(c => c.toLowerCase().includes(key)); if (hit) return hit; }\n      const partial = cats.find(c => c.toLowerCase().includes(l));\n      return partial || label;\n    };\n    const groups = raw.map(g => ({ ...g, subjects: Array.from(new Set(g.subjects.map(toCat))) }));\n    this.setState({ groups });\n  }\n\n  async loadGroups() {\n    const url = this.props.groupsSheetUrl || GROUPS_SHEET_URL;\n    if (!url) { this.setState({ groupsStatus: 'none' }); return; }\n    try {\n      const rows = this.parseCSV(await this.fetchCSV(url));\n      const get = (o, keys) => { for (const k of Object.keys(o)) { if (keys.includes(k.trim().toLowerCase()) && String(o[k]).trim()) return String(o[k]).trim(); } return ''; };\n      const groups = rows.map((o, i) => {\n        let link = get(o, ['telegram link', 'link', 'telegram']);\n        if (link && !/^https?:\\/\\//i.test(link)) link = 'https://' + link.replace(/^@/, 't.me/');\n        return {\n          id: 'g' + i,\n          org: get(o, ['name of group', 'organisation', 'organization', 'org']),\n          platform: get(o, ['platform']) || 'Telegram',\n          note: get(o, ['additional notes', 'notes', 'note']).replace(/\\s*\\n\\s*/g, ' '),\n          name: get(o, ['group name', 'name', 'group']),\n          subjects: get(o, ['industry interest', 'industry interests', 'industry']).split(/[;,]/).map(s => s.trim()).filter(s => s && s !== '-'),\n          desc: get(o, ['description', 'desc']),\n          link,\n        };\n      }).filter(g => (g.name || g.org) && g.link);\n      this.setState({ groupsRaw: groups, groupsStatus: 'ok' }, () => this.mapGroupIndustries());\n    } catch (e) {\n      if (!this.state.groups.length) this.setState({ groupsStatus: 'error' });\n    }\n  }\n\n  async loadData(silent) {\n    const sheetUrl = this.props.sheetUrl || \"https://docs.google.com/spreadsheets/d/e/2PACX-1vQljtaq_7vheqd56NZ7gb-GiRYdeAg3pqfImXJtG1hUCDdvLgGR7Nypb6_iZ6eDCszlVu8qu0n2Awzy/pub?gid=0&single=true&output=csv\";\n    if (silent) this.setState({ isRefreshing: true });\n    try {\n      const csvText = await this.fetchCSV(sheetUrl);\n      const rows = this.parseCSV(csvText);\n      const today = new Date(); today.setHours(0, 0, 0, 0);\n\n      const parsed = rows.map((obj, index) => {\n        const subjectsRaw = obj['Industry Interest'] || obj['Industry Interests'] || obj['Industry'] || obj['Subjects'] || obj['Subject'] || '';\n        const subjects = subjectsRaw.split(/[;,]/).map(s => s.trim()).filter(s => s && s !== '-');\n        const statusRaw = (obj['Status'] || '').toLowerCase();\n        let isPast;\n        const evD = this.getSortableDate(obj['Date of Event']);\n        if (statusRaw.includes('past') || statusRaw.includes('completed')) isPast = true;\n        else if (evD && evD < today) isPast = true;\n        else if (statusRaw.includes('upcoming')) isPast = false;\n        else isPast = false;\n\n        return {\n          id: index + 1,\n          name: obj['Name'] || '',\n          level: obj['Level'] || 'JC1, JC2',\n          subjects,\n          type: obj['Type'] || 'General',\n          desc: obj['Description'] || '',\n          duration: obj['Duration'] || '',\n          timing: obj['Timing'] || '',\n          link: obj['Link'] || '',\n          linkLabel: obj['Link Label'] || obj['Link label'] || 'Learn More',\n          regDate: obj['Date to Register'] || '',\n          eventDate: obj['Date of Event'] || '',\n          location: obj['Location'] || '',\n          isPast,\n          attachments: obj['Attachments'] || '',\n        };\n      }).filter(r => r.name);\n\n      const types = new Set(), levels = new Set(), subjects = new Set();\n      parsed.forEach(o => {\n        o.subjects.forEach(s => subjects.add(s));\n        if (o.level) o.level.split(',').forEach(l => levels.add(l.trim()));\n        if (o.type) types.add(o.type);\n      });\n\n      this.setState({\n        allOpportunities: parsed,\n        uniqueTypes: Array.from(types).filter(Boolean).sort(),\n        uniqueLevels: Array.from(levels).filter(Boolean).sort(),\n        uniqueSubjects: Array.from(subjects).filter(Boolean).sort(),\n        isLoading: false, isRefreshing: false,\n        lastUpdated: new Date(), lastUpdatedLabel: 'Updated just now',\n      }, () => this.mapGroupIndustries());\n    } catch (e) {\n      console.error('Failed loading opportunities:', e);\n      this.setState({ isLoading: false, isRefreshing: false });\n    }\n  }\n\n  parseCSV(text) {\n    if (window.Papa) { const r = window.Papa.parse(text, { header: true, skipEmptyLines: true }); return r.data; }\n    const lines = text.split(/\\r?\\n/).filter(Boolean);\n    if (!lines.length) return [];\n    const headers = lines[0].split(',').map(h => h.trim());\n    return lines.slice(1).map(line => {\n      const cells = line.split(','); const obj = {};\n      headers.forEach((h, i) => obj[h] = (cells[i] || '').trim());\n      return obj;\n    });\n  }\n\n  getSortableDate(str) {\n    if (!str || str === '—' || str === '-') return null;\n    const clean = String(str).split(';').pop().trim();\n    const p = Date.parse(clean);\n    return isNaN(p) ? null : new Date(p);\n  }\n\n  getTypeTone(type) {\n    const t = (type || '').toLowerCase();\n    if (t.includes('scholarship')) return 'gold';\n    if (t.includes('competition')) return 'maroon';\n    if (t.includes('workshop')) return 'success';\n    return 'neutral';\n  }\n\n  toggleType(v) { this.setState(s => ({ activeTypes: s.activeTypes.includes(v) ? s.activeTypes.filter(x => x !== v) : [...s.activeTypes, v] })); }\n  toggleLevel(v) { this.setState(s => ({ activeLevels: s.activeLevels.includes(v) ? s.activeLevels.filter(x => x !== v) : [...s.activeLevels, v] })); }\n  toggleSubject(v) { this.setState(s => ({ activeSubjects: s.activeSubjects.includes(v) ? s.activeSubjects.filter(x => x !== v) : [...s.activeSubjects, v] })); }\n  clearFilters() { this.setState({ activeTypes: [], activeLevels: [], activeSubjects: [] }); }\n  resetSearchAndFilters() { this.setState({ searchQuery: '', activeTypes: [], activeLevels: [], activeSubjects: [] }); }\n\n  sortBy(col) {\n    if (this.state.sortColumn === col) this.setState(s => ({ sortOrder: s.sortOrder === 'asc' ? 'desc' : 'asc' }));\n    else this.setState({ sortColumn: col, sortOrder: 'asc' });\n  }\n\n  openModal(opp) { this.setState({ modalOpen: true, modalOppRaw: opp }); }\n  closeModal() { this.setState({ modalOpen: false }); }\n\n  dropdown(key, allLabel, values, active, toggle, stateKey) {\n    const list = Array.isArray(values) ? values : [];\n    const sel = active instanceof Set ? Array.from(active) : (Array.isArray(active) ? active : []);\n    const has = v => sel.includes(v);\n    const open = this.state.openMenu === key;\n    const clear = () => this.setState({ [stateKey]: [] });\n    const allOn = list.length > 0 && list.every(has);\n    const tile = on => ({ on, bg: on ? 'var(--maroon-700)' : '#FFFFFF', color: on ? '#FBF7EF' : 'var(--ink-900)', border: on ? 'var(--maroon-700)' : 'var(--color-border)' });\n    const row = (label, on, onClick, first) => ({ label, on, onClick, tick: on ? '✓' : '', fw: first ? '700' : '400', divider: first ? '1px solid #F0E6D0' : 'none', bg: on && !first ? '#FBF3E1' : 'transparent', boxBg: on ? 'var(--maroon-700)' : '#FFFFFF', boxBorder: on ? 'var(--maroon-700)' : '#B8A99A' });\n    return {\n      open, useTiles: list.length <= 5, useMenu: list.length > 5,\n      label: !sel.length ? allLabel : sel.length === 1 ? sel[0] : sel.length + ' selected',\n      toggle: () => this.setState(st => ({ openMenu: st.openMenu === key ? null : key })),\n      clear,\n      tiles: [{ label: 'All', ...tile(!sel.length), onClick: clear }, ...list.map(v => ({ label: v, ...tile(has(v)), onClick: () => toggle(v) }))],\n      choices: [row('Select all', allOn, () => this.setState({ [stateKey]: allOn ? [] : [...list] }), true)].concat(list.map(v => row(v, has(v), () => toggle(v), false))),\n    };\n  }\n  renderVals() {\n    const s = this.state;\n    let list = s.allOpportunities.filter(o => {\n      if (s.currentTab === 'upcoming' && o.isPast) return false;\n      if (s.currentTab === 'past' && !o.isPast) return false;\n      if (s.searchQuery) {\n        const q = s.searchQuery.toLowerCase();\n        const hit = (o.name && o.name.toLowerCase().includes(q)) ||\n          (o.desc && o.desc.toLowerCase().includes(q)) ||\n          (o.location && o.location.toLowerCase().includes(q)) ||\n          (o.subjects && o.subjects.some(x => x.toLowerCase().includes(q)));\n        if (!hit) return false;\n      }\n      if (s.activeTypes.length && !s.activeTypes.includes(o.type)) return false;\n      if (s.activeLevels.length) {\n        const lv = o.level ? o.level.split(',').map(l => l.trim()) : [];\n        if (!lv.some(l => s.activeLevels.includes(l))) return false;\n      }\n      if (s.activeSubjects.length && !o.subjects.some(x => s.activeSubjects.includes(x))) return false;\n      return true;\n    });\n\n    list = [...list].sort((a, b) => {\n      let dir = s.sortOrder === 'asc' ? 1 : -1;\n      if (s.sortColumn === 'name') return dir * (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());\n      if (s.sortColumn === 'type') return dir * (a.type || '').toLowerCase().localeCompare((b.type || '').toLowerCase());\n      const dA = this.getSortableDate(s.sortColumn === 'regDate' ? a.regDate : a.eventDate);\n      const dB = this.getSortableDate(s.sortColumn === 'regDate' ? b.regDate : b.eventDate);\n      if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1;\n      return dir * (dA - dB);\n    });\n\n    const displayList = list.map(o => ({\n      ...o,\n      openHandler: () => this.openModal(o),\n      typeTone:
