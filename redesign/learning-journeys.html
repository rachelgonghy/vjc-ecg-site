function parseCSVText(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

function parseOutline(text) {
    if (!text || text.trim() === '-') return [];
    const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
    const bullets = [];
    lines.forEach((line) => {
      if (line.startsWith('-')) bullets.push(line.replace(/^-\s*/, ''));
      else if (/^sign ?up$/i.test(line)) { /* stray label */ }
      else if (bullets.length) bullets[bullets.length - 1] += ' ' + line;
      else bullets.push(line);
    });
    return bullets;
  }

function parseTestimonial(text) {
    if (!text || text.trim() === '-') return null;
    const idx = text.indexOf(':');
    if (idx === -1) { const q = text.trim().replace(/^"+|"+$/g, ''); return q ? { name: '', quote: q } : null; }
    const name = text.slice(0, idx).trim();
    const quote = text.slice(idx + 1).trim().replace(/^"+|"+$/g, '');
    return quote ? { name, quote } : null;
  }

function parseTakeaways(text) {
    if (!text || text.trim() === '-') return [];
    const blocks = text.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
    const result = [];
    blocks.forEach((block) => {
      const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
      if (!lines.length) return;
      if (lines[0].startsWith('-')) {
        lines.forEach((line) => {
          const clean = line.replace(/^-\s*/, '');
          const m = clean.match(/^(.*?\.)\s+(.*)$/);
          if (m) result.push({ title: m[1], body: m[2] });
          else result.push({ title: '', body: clean });
        });
      } else {
        result.push({ title: lines[0], body: lines.slice(1).join(' ') });
      }
    });
    return result;
  }

function parseSheet(text) {
    const rows = parseCSVText(text).filter((r) => r.some((c) => c && c.trim()));
    if (rows.length < 2) return [];
    const header = rows[0].map((h) => h.trim().toLowerCase());
    const col = (name) => header.findIndex((h) => h.startsWith(name));
    const idx = {
      date: col('date'), timing: col('timing'), company: col('company'), outline: col('programme outline'),
      sector: col('sector'), transport: col('transport'), location: col('location'), photo: col('photo'),
      testimonial: col('testimonials'), signup: col('signup'), reflection: col('reflection'), takeaways: col('key takeaways'),
    };
    const journeys = [];
    let current = null;
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const cell = (i) => (i >= 0 && row[i] !== undefined ? row[i].trim() : '');
      const date = cell(idx.date);
      if (date) {
        current = {
          date, timing: cell(idx.timing), company: cell(idx.company), sector: cell(idx.sector),
          transport: /^y/i.test(cell(idx.transport)) ? 'Transport provided' : '',
          location: cell(idx.location) === '-' ? '' : cell(idx.location),
          outline: parseOutline(cell(idx.outline)), learnings: [],
          photos: [], testimonials: [],
          takeaways: parseTakeaways(cell(idx.takeaways)),
          signupLink: cell(idx.signup) === '-' ? '' : cell(idx.signup),
          reflectionLink: cell(idx.reflection) === '-' ? '' : cell(idx.reflection),
        };
        journeys.push(current);
      }
      if (!current) continue;
      const photo = cell(idx.photo);
      if (photo && photo !== '-') current.photos.push({ url: photo });
      const testimonial = parseTestimonial(cell(idx.testimonial));
      if (testimonial) current.testimonials.push(testimonial);
    }
    return journeys.filter((j) => j.company);
  }

var E = function (s) { return ECG.esc(s); }, I = function (n) { return ECG.icon(n); };
var data = getFallbackRaw(), year = 'All', sector = 'All', qi = {};
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function when(d) { var t = Date.parse(d); return isNaN(t) ? null : new Date(t); }
function render() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var list = data.slice().sort(function (a, b) { return (when(b.date) || 0) - (when(a.date) || 0); });
  var years = Array.from(new Set(list.map(function (j) { var d = when(j.date); return d ? String(d.getFullYear()) : ''; }).filter(Boolean)));
  var sectors = Array.from(new Set(list.map(function (j) { return j.sector; }).filter(Boolean))).sort();
  var chip = function (v, cur, key) { return '<button type="button" class="chip' + (v === cur ? ' is-active' : '') + '" aria-pressed="' + (v === cur) + '" data-' + key + '="' + E(v) + '">' + E(v) + '</button>'; };
  document.querySelector('[data-years]').innerHTML = ['All'].concat(years).map(function (y) { return chip(y, year, 'year'); }).join('');
  document.querySelector('[data-sectors]').innerHTML = ['All'].concat(sectors).map(function (s) { return chip(s, sector, 'sector'); }).join('');
  var shown = list.filter(function (j) { var d = when(j.date); return (year === 'All' || (d && String(d.getFullYear()) === year)) && (sector === 'All' || j.sector === sector); });
  document.querySelector('[data-list]').innerHTML = shown.length ? shown.map(function (j, n) {
    var d = when(j.date), up = d && d >= today, id = 'j' + data.indexOf(j);
    var q = j.testimonials || [], k = qi[id] || 0;
    var photos = (j.photos || []).map(function (p, i) { return '<button type="button" data-photo="' + E(p.url) + '" aria-label="View photo ' + (i + 1) + ' from ' + E(j.company) + '"><img src="' + E(p.url) + '" alt="' + E(j.company) + ' learning journey photo ' + (i + 1) + '" loading="lazy" decoding="async"></button>'; }).join('');
    var take = (j.takeaways || []).map(function (t) { return '<div>' + (t.title ? '<b>' + E(t.title) + '</b>' : '') + E(t.body) + '</div>'; }).join('');
    return '<article class="jcard' + (up ? ' is-upcoming' : '') + '" id="' + id + '">' +
      '<div class="jdate">' + (d ? '<b>' + d.getDate() + '</b><span>' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear() + '</span>' : '<span>' + E(j.date) + '</span>') + '</div>' +
      '<div class="jcard__main"><div class="row">' + (up ? '<span class="tag">Upcoming</span>' : '<span class="tag tag--maroon">Past</span>') + (j.sector ? '<span class="tag tag--ok">' + E(j.sector) + '</span>' : '') + '</div>' +
      '<h3>' + E(j.company) + '</h3>' +
      '<div class="meta">' + (j.timing ? '<span>' + I('clock') + E(j.timing) + '</span>' : '') + (j.location ? '<span>' + I('map-pin') + E(j.location) + '</span>' : '') + (j.transport ? '<span>' + I('route') + E(j.transport) + '</span>' : '') + '</div>' +
      (j.outline.length ? '<ul>' + j.outline.map(function (o) { return '<li>' + E(o) + '</li>'; }).join('') + '</ul>' : '') +
      (photos ? '<div class="strip">' + photos + '</div>' : '') +
      (q.length ? '<div class="quote" data-q="' + id + '"><div class="t-swap"><blockquote>\u201c' + E(q[k].quote) + '\u201d</blockquote>' + (q[k].name ? '<cite>' + E(q[k].name) + (q.length > 1 ? ' \u00b7 ' + (k + 1) + ' of ' + q.length : '') + '</cite>' : '') + '</div>' +
        (q.length > 1 ? '<div class="quote__nav"><button type="button" data-qstep="-1" aria-label="Previous quote">' + I('arrow-left') + '</button><button type="button" data-qstep="1" aria-label="Next quote">' + I('arrow-right') + '</button></div>' : '') + '</div>' : '') +
      (take ? '<div class="qa t-acc" data-open="false"><button class="qa__q" type="button"><span>What students took away</span></button><div class="t-acc-panel"><div class="t-acc-panel-inner"><div class="qa__a"><div class="takeaways">' + take + '</div></div></div></div></div>' : '') +
      '<div class="row">' + (j.signupLink && up ? '<a class="btn btn--gold" href="' + E(j.signupLink) + '" target="_blank" rel="noopener">' + I('calendar-check') + 'Sign up</a>' : '') +
        (j.signupLink && !up ? '<a class="btn btn--ghost" href="' + E(j.signupLink) + '" target="_blank" rel="noopener">Sign-up form</a>' : '') +
        (j.reflectionLink ? '<a class="btn btn--ghost" href="' + E(j.reflectionLink) + '" target="_blank" rel="noopener">' + I('file-text') + 'Reflection form</a>' : '') + '</div>' +
      '</div></article>';
  }).join('') : '<div class="empty">No learning journeys match these filters yet.</div>';
  ECG.initAccordions(document.querySelector('[data-list]'));
}
function stepQuote(id, dir) {
  var j = data[+id.slice(1)], n = j.testimonials.length; qi[id] = ((qi[id] || 0) + dir + n) % n;
  var box = document.querySelector('[data-q="' + id + '"] .t-swap'), t = j.testimonials[qi[id]];
  box.classList.add('is-out');
  setTimeout(function () {
    box.innerHTML = '<blockquote>\u201c' + E(t.quote) + '\u201d</blockquote>' + (t.name ? '<cite>' + E(t.name) + ' \u00b7 ' + (qi[id] + 1) + ' of ' + n + '</cite>' : '');
    void box.offsetWidth; box.classList.remove('is-out');
  }, 150);
}
function lightbox(src, from) {
  var el = document.createElement('div'); el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Photo');
  el.innerHTML = '<img src="' + E(src) + '" alt=""><button type="button" aria-label="Close photo">' + I('x') + '</button>';
  var close = function () { el.remove(); document.removeEventListener('keydown', esc); if (from) from.focus(); };
  var esc = function (e) { if (e.key === 'Escape') close(); };
  el.addEventListener('click', function (e) { if (e.target === el || e.target.closest('button')) close(); });
  document.addEventListener('keydown', esc); document.body.appendChild(el); el.querySelector('button').focus();
}
function start() {
  render();
  var note = document.querySelector('[data-sync]');
  var s = ECG.sheet(SHEET_URL);
  var apply = function (d) { var p = parseSheet([d.head].concat(d.rows).map(function (r) { return r.map(function (c) { return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n')); if (p.length) { data = p; render(); note.textContent = 'Up to date with the ECG sheet.'; } };
  if (s.cached) apply(s.cached);
  s.fresh.then(apply).catch(function () { note.textContent = 'Showing saved journeys. The live list didn\u2019t load.'; });
  var main = document.querySelector('main');
  main.addEventListener('click', function (e) {
    var y = e.target.closest('[data-year]'), c = e.target.closest('[data-sector]'), q = e.target.closest('[data-qstep]'), p = e.target.closest('[data-photo]');
    if (y) { year = y.getAttribute('data-year'); render(); }
    if (c) { sector = c.getAttribute('data-sector'); render(); }
    if (q) stepQuote(q.closest('[data-q]').getAttribute('data-q'), +q.getAttribute('data-qstep'));
    if (p) lightbox(p.getAttribute('data-photo'), p);
  });
}
if (window.ECG) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
</body>
</html>
