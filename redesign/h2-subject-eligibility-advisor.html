<script>

/* ---- Wording and sheet parser carried over unchanged; the sheet can still override any line ---- */
const DEFAULT_CONTENT = {

  'result.h1_recommended.badge_label':'Action needed',

function parseContentCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.length);
  const map = {};
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^"((?:[^"]|"")*)","((?:[^"]|"")*)"$/);
    if (!m) continue;
    const key = m[1].replace(/""/g, '"');
    const val = m[2].replace(/""/g, '"');
    map[key] = val;
  }
  return map;
}


var CONTENT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5uHZQQHbZu8a2X2E9YsH7vu07GGxAEJ5V0-W9AVfL472JaNNlJpxvj2732Lfdf2PcgrIDv-omjE1b/pub?gid=16754080&single=true&output=csv';
var E = function (s) { return ECG.esc(s); }, I = function (n) { return ECG.icon(n); };
var C = Object.assign({}, DEFAULT_CONTENT), g = function (k) { return C[k] != null ? C[k] : ''; };
var st = { screen: 'WELCOME', history: [], track: null, score: null, amath: null, result: null };
function go(next) { st.history.push(st.screen); st.screen = next; render(); }
function finish(r) { st.result = r; go('RESULTS'); }
/* Same branching as the previous advisor. */
var SCREENS = {
  TRACK: function () { return { t: g('track.title'), opts: [[g('track.opt1'), '', function () { st.track = 'O_LEVEL'; go('SCORE'); }], [g('track.opt2'), '', function () { st.track = 'IP'; go('SCORE'); }]] }; },
  SCORE: function () {
    var ol = st.track === 'O_LEVEL';
    var pick = function (r) { st.score = r;
      if (ol) { if (r === 'L1R5_LOW') finish('ELIGIBLE_4H2'); else go('MATHSCI'); }
      else { if (r === 'GPA_HIGH') finish('ELIGIBLE_4H2'); else if (r === 'GPA_MID') finish('ELIGIBLE_3H2'); else go('MATHSCI'); } };
    return ol ? { t: g('score.olevel_title'), s: g('score.olevel_subtitle'), opts: [[g('score.olevel_opt1'), '', function () { pick('L1R5_LOW'); }], [g('score.olevel_opt2'), '', function () { pick('L1R5_MID'); }], [g('score.olevel_opt3'), '', function () { pick('L1R5_HIGH'); }]] }
      : { t: g('score.ip_title'), s: g('score.ip_subtitle'), opts: [[g('score.ip_opt1'), '', function () { pick('GPA_HIGH'); }], [g('score.ip_opt2'), g('score.ip_opt2_sub'), function () { pick('GPA_MID'); }], [g('score.ip_opt3'), g('score.ip_opt3_sub'), function () { pick('GPA_LOW'); }]] };
  },
  MATHSCI: function () { return { t: g('mathsci.title'), s: st.score === 'L1R5_MID' ? g('mathsci.subtitle_3h2') : g('mathsci.subtitle_default'), opts: [
    [g('mathsci.opt1_label'), g('mathsci.opt1_sub'), function () { if (st.track === 'IP' && st.score === 'GPA_LOW') go('LOU'); else if (st.score === 'L1R5_MID') go('AMATH'); else go('READYSTATUS'); }],
    [g('mathsci.opt2_label'), g('mathsci.opt2_sub'), function () { finish('ARTS_STREAM'); }]] }; },
  LOU: function () { return { t: g('lou.title'), s: g('lou.subtitle'), opts: [[g('lou.opt1_label'), g('lou.opt1_sub'), function () { finish('LOU_H1_ONLY'); }], [g('lou.opt2_label'), g('lou.opt2_sub'), function () { finish('CONDITIONAL_H2'); }]] }; },
  AMATH: function () { return { t: g('amath.title'), s: g('amath.subtitle'), opts: [[g('amath.opt1_label'), '', function () { st.amath = true; finish('ELIGIBLE_H2_SCI'); }], [g('amath.opt2_label'), '', function () { st.amath = false; finish('CONDITIONAL_VEP'); }]] }; },
  READYSTATUS: function () { return { t: g('readystatus.title'), s: g('readystatus.subtitle'), note: g('readystatus.note'), opts: [[g('readystatus.opt1_label'), g('readystatus.opt1_sub'), function () { go('READYSCORE'); }], [g('readystatus.opt2_label'), g('readystatus.opt2_sub'), function () { finish('CONDITIONAL_VEP'); }]] }; },
  READYSCORE: function () { return { t: g('readyscore.title'), s: g('readyscore.subtitle'), opts: [[g('readyscore.opt1_label'), g('readyscore.opt1_sub'), function () { finish('ELIGIBLE_H2_SCI'); }], [g('readyscore.opt2_label'), g('readyscore.opt2_sub'), function () { finish('H1_RECOMMENDED'); }], [g('readyscore.opt3_label'), g('readyscore.opt3_sub'), function () { finish('CONDITIONAL_VEP'); }]] }; }
};
function result() {
  var r = st.result, q = g('content.impact_quiz');
  switch (r) {
    case 'ELIGIBLE_4H2': var recs = [q]; if (!(st.track === 'IP' && st.score === 'GPA_HIGH')) recs.unshift(g('result.eligible_4h2.rec_extra'));
      return ['eligible_4h2', st.track === 'O_LEVEL' ? g('result.eligible_4h2.desc_olevel') : g('result.eligible_4h2.desc_ip'), recs];
    case 'ELIGIBLE_3H2': return ['eligible_3h2', g('result.eligible_3h2.desc'), [g('result.eligible_3h2.rec1'), g('result.eligible_3h2.rec2'), q]];
    case 'LOU_H1_ONLY': return ['lou_h1_only', g('result.lou_h1_only.desc'), [g('result.lou_h1_only.rec1'), g('result.lou_h1_only.rec2'), q]];
    case 'CONDITIONAL_H2': case 'CONDITIONAL_VEP':
      var mid = st.score === 'L1R5_MID' || (st.track === 'IP' && st.score === 'GPA_LOW');
      return ['conditional', g('result.conditional.desc'), mid && st.amath === false ? [g('result.conditional.rec_vep1'), g('result.conditional.rec_vep2_practice'), q] : [g('result.conditional.rec_vep1'), g('result.conditional.rec_vep2_target'), g('result.conditional.rec_vep3_drop')]];
    case 'ARTS_STREAM': return ['arts_stream', g('result.arts_stream.desc'), [g('result.arts_stream.rec1'), g('result.arts_stream.rec2'), q]];
    case 'ELIGIBLE_H2_SCI': return ['eligible_h2_sci', g('result.eligible_h2_sci.desc'), st.track === 'O_LEVEL' && st.score === 'L1R5_MID' && st.amath === false ? [g('result.conditional.rec_vep1'), g('result.conditional.rec_vep2_practice'), q] : [q, g('result.eligible_h2_sci.rec_workload')]];
    default: return ['h1_recommended', g('result.h1_recommended.desc'), [g('result.h1_recommended.rec1'), g('result.h1_recommended.rec2'), q]];
  }
}
function render() {
  var host = document.querySelector('[data-quiz]'), html;
  var top = '<div class="quiz__top"><div class="stepdots" aria-hidden="true">' + [0, 1, 2, 3].map(function (i) { return '<i class="' + (i < Math.min(st.history.length, 4) ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
    (st.history.length ? '<div class="row"><button class="btn btn--ghost" type="button" data-back>' + I('arrow-left') + 'Back</button></div>' : '') + '</div>';
  if (st.screen === 'WELCOME') {
    html = '<div class="quiz"><h2>' + E(g('welcome.title')) + '</h2><p class="quiz__sub">' + E(g('welcome.subtitle')) + '</p>' +
      '<div class="callout">' + I('info') + '<div>' + E(g('welcome.note')) + '</div></div><div class="row"><button class="btn btn--gold btn--lg" type="button" data-start>' + E(g('welcome.button')) + I('arrow-right') + '</button></div></div>';
  } else if (st.screen === 'RESULTS') {
    var r = result(), k = r[0];
    html = '<div class="quiz">' + top + '<div class="verdict-card"><span class="tag">' + E(g('result.' + k + '.badge_label')) + '</span><h2>' + E(g('result.' + k + '.title')) + '</h2><p>' + E(r[1]) + '</p></div>' +
      '<h3>' + E(g('results.actions_label') || 'What to do next') + '</h3><ul class="checks">' + r[2].filter(Boolean).map(function (x) { return '<li>' + E(x) + '</li>'; }).join('') + '</ul>' +
      '<div class="row"><button class="btn btn--ghost" type="button" data-restart>' + I('rotate-ccw') + 'Start over</button><a class="btn" ' + ECG.linkAttrs('book-an-ecg-session') + '>' + I('calendar-check') + 'Talk it through</a><a class="btn btn--ghost" ' + ECG.linkAttrs('h2-degree-mapping-advisor') + '>See which degrees open</a></div></div>';
  } else {
    var s = SCREENS[st.screen](); st._opts = s.opts;
    html = '<div class="quiz">' + top + '<h2 id="qtitle" tabindex="-1">' + E(s.t) + '</h2>' + (s.s ? '<p class="quiz__sub">' + E(s.s) + '</p>' : '') +
      (s.note ? '<div class="callout">' + I('info') + '<div>' + E(s.note) + '</div></div>' : '') +
      '<div class="opts" role="group" aria-labelledby="qtitle">' + s.opts.map(function (o, i) { return '<button class="opt" type="button" data-opt="' + i + '"><span><b>' + E(o[0]) + '</b>' + (o[1] ? '<small>' + E(o[1]) + '</small>' : '') + '</span>' + I('arrow-right') + '</button>'; }).join('') + '</div></div>';
  }
  host.innerHTML = html; host.classList.remove('panel-in'); void host.offsetWidth; host.classList.add('panel-in');
  var h = host.querySelector('h2'); if (h && st.history.length) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}
function start() {
  render();
  var s = ECG.sheet(CONTENT_URL);
  var apply = function (d) { var map = {}; d.rows.forEach(function (r) { if (r[0]) map[r[0]] = r[1] || ''; }); Object.keys(map).forEach(function (k) { if (map[k]) C[k] = map[k]; }); render(); };
  if (s.cached) apply(s.cached); s.fresh.then(apply).catch(function () { });
  document.querySelector('[data-quiz]').addEventListener('click', function (e) {
    if (e.target.closest('[data-start]')) go('TRACK');
    var o = e.target.closest('[data-opt]'); if (o) st._opts[+o.getAttribute('data-opt')][2]();
    if (e.target.closest('[data-back]')) { st.screen = st.history.pop() || 'WELCOME'; render(); }
    if (e.target.closest('[data-restart]')) { st = { screen: 'TRACK', history: [], track: null, score: null, amath: null, result: null }; render(); }
  });
}
if (window.ECG) start(); else document.addEventListener('DOMContentLoaded', start);
})();
