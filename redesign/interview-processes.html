function acronym(s) { const m = s.match(/\(([A-Z][A-Za-z*]{1,8})\)/); return m ? m[1].toLowerCase() : ''; }
function shortAbout(text) {
  const t = text.replace(/\s+/g, ' ').trim();
  const parts = t.match(/[^.!?]+[.!?]+(\s|$)/g) || [t];
  let out = '';
  for (const p of parts) { if ((out + p).length > 260 && out) break; out += p; }
  return out.trim();
}

function parseCSV(text) {
  const rows = []; let row = []; let cur = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

function col(headers, re) { return headers.findIndex(h => re.test(h)); }

function toLines(value, forceBullets) {
  const splitter = /[•●]/.test(value) ? /\n+|\s*[•●]\s*/ : /\n+|;\s*(?=\S)/;
  const parts = value.split(splitter).map(s => s.trim().replace(/^[-•●·–*]\s*/, '')).filter(Boolean);
  const bullet = forceBullets || parts.length > 1;
  return parts.map(text => /:$/.test(text) && text.length < 40 ? { text: text.replace(/:$/, ''), bullet: false, weight: 600, gap: '6px' } : { text, bullet, weight: 400, gap: '0' });
}

function noBond(t) {
  if (!t) return '';
  const parts = t.match(/[^.!?]+[.!?]*(\s+|$)/g) || [t];
  return parts.filter(s => !/\bbond|bonded|bond-free|serve (a|an|your)? ?\d|\d+[- ]year (bond|service)|service obligation|work (for|at) [^.]* for \d/i.test(s)).join('').replace(/\s*\(\s*\)/g, '').trim();
}

const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function lookup(map, title) {
  if (map[title]) return map[title];
  if (map[title + ' Scholarship']) return map[title + ' Scholarship'];
  const t = norm(title);
  const key = Object.keys(map).find(k => norm(k) === t) || Object.keys(map).find(k => t.startsWith(norm(k)) || norm(k).startsWith(t));
  return key ? map[key] : null;
}

  ['Interview format', /interview format/],
  ['Selection rounds', /selection round/],
  ['Common questions', /common question/],

const LOGO_SKIP = /brightsparks|google\.|forms\.gle|padlet|vjc\.|for\.edu\.sg|bit\.ly|tinyurl/i;
const LOCAL_LOGOS = [[/\bMSF\b|social and family/i, 'assets/img/logos/cf982ea332.png'], [/\bNUS\b|national university of singapore/i, 'assets/img/logos/3173a593e4.png'], [/\bDSTA\b|defence science/i, 'assets/img/logos/b0ee9a2722.png'], [/\bMINDEF\b|ministry of defence|defence merit/i, 'assets/img/logos/69434abc7c.png'], [/\bSAF\b|armed forces|young leader/i, 'assets/img/logos/cfb6b8c4f0.png'], [/VJC Scholarship|Lee Phui Mun/i, 'assets/img/logos/c2df1c0749.png'], [/mext|monbukagakusho|japanese government|emb-japan/i, 'assets/img/logos/f121817c6d.png'], [/brightsparks/i, 'assets/img/logos/28599a2dc9.png']];
function logoFor(name, link) {
  name = name || '';
  const local = LOCAL_LOGOS.find(([re]) => re.test(name)) || LOCAL_LOGOS.find(([re]) => re.test(link || ''));
  const hit = LOGO_DOMAINS.find(([re]) => re.test(name));
  let domain = hit ? hit[1] : '';
  if (!hit && link) {
    try { const h = new URL(/^https?:/i.test(link) ? link : 'https://' + link).hostname.replace(/^www\./, ''); if (!LOGO_SKIP.test(h)) domain = h; } catch (e) {}
  }
  const acr = /\bVJC\b/.test(name) ? 'VJC' : (name.match(/\(([A-Z*&]{2,6})\)/) || [])[1];
  const initials = acr || name.replace(/[^A-Za-z\s]/g, ' ').split(/\s+/).filter(w => w && /[A-Z]/.test(w[0]) && !/^(The|Of|And|For|In|On)$/.test(w)).slice(0, 3).map(w => w[0]).join('') || '•';
  return {
    initials: initials.slice(0, 4),
    hasLogo: !!(local || domain),
    logoSrc: local ? local[1] : (domain ? 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=128' : ''),
    onLogoError: e => { e.currentTarget.style.display = 'none'; },
    onLogoLoad: e => { const i = e.currentTarget, w = i.naturalWidth; if (w < 32) i.style.display = 'none'; else if (w < 64) i.style.padding = Math.max(7, (44 - w) / 2) + 'px'; }
  };
}


var E = function (s) { return ECG.esc(s); }, I = function (n) { return ECG.icon(n); };
var records = [], q = '', type = 'All';
var FBKEY = { 'Interview format': 'format', 'Selection rounds': 'rounds', 'Common questions': 'qs', "Seniors' tips": 'tips' };
function build(rows) {
  var h = rows[0].map(function (x) { return x.trim().toLowerCase(); });
  var iType = col(h, /^type/), iName = col(h, /interview round|^scholarship/), iCycle = col(h, /cycle|year/), iTake = col(h, /takeaway/), iFull = col(h, /full name/);
  var sec = SECTIONS.map(function (s) { return [s[0], col(h, s[1])]; });
  var cell = function (r, i) { return i >= 0 && r[i] ? r[i].trim() : ''; };
  var linkCols = h.map(function (x, i) { return /link|url/.test(x) ? i : -1; }).filter(function (i) { return i >= 0; });
  return rows.slice(1).map(function (r) {
    var title = cell(r, iName).replace(/\s+/g, ' '); if (!title) return null;
    var fb = lookup(SUMMARIES, title) || {};
    var link = linkCols.map(function (i) { return cell(r, i); }).filter(function (v) { return /^(https?:\/\/|www\.)/i.test(v); })[0] || (THREAD_LINKS[title] ? THREAD_BASE + THREAD_LINKS[title] : '');
    if (link && !/^https?:/i.test(link)) link = 'https://' + link;
    var ab = lookup(ABOUT, title) || [];
    return { title: title, type: cell(r, iType) || 'Other', cycle: cell(r, iCycle), take: cell(r, iTake) || fb.take || '', link: link,
      full: cell(r, iFull) || ab[0] || '', about: ab[1] || (cell(r, iType) === 'Pre-U' ? 'An award or scholarship you apply for while in JC.' : 'A scholarship that supports your university studies.'),
      sections: sec.map(function (s) { return { label: s[0], value: cell(r, s[1]) || fb[FBKEY[s[0]]] || '' }; }).filter(function (s) { return s.value && s.value !== '-'; }),
      search: r.join(' ').toLowerCase() };
  }).filter(Boolean);
}
function fromSummaries() {
  return Object.keys(SUMMARIES).map(function (k) {
    var fb = SUMMARIES[k], ab = lookup(ABOUT, k) || [];
    return { title: k, type: 'Scholarship', cycle: '', take: fb.take || '', link: THREAD_LINKS[k] ? THREAD_BASE + THREAD_LINKS[k] : '', full: ab[0] || '', about: ab[1] || '',
      sections: Object.keys(FBKEY).map(function (l) { return { label: l, value: fb[FBKEY[l]] || '' }; }).filter(function (s) { return s.value; }), search: (k + ' ' + JSON.stringify(fb)).toLowerCase() };
  });
}
function lines(v) { var ls = toLines(v, true); return '<ul>' + ls.map(function (l) { return l.bullet === false ? '</ul><b style="display:block;margin-top:8px">' + E(l.text) + '</b><ul>' : '<li>' + E(l.text) + '</li>'; }).join('') + '</ul>'; }
function render() {
  var types = Array.from(new Set(records.map(function (r) { return r.type; }))).sort();
  document.querySelector('[data-types]').innerHTML = types.length > 1 ? ['All'].concat(types).map(function (t) { return '<button type="button" class="chip' + (t === type ? ' is-active' : '') + '" aria-pressed="' + (t === type) + '" data-type="' + E(t) + '">' + E(t) + '</button>'; }).join('') : '';
  var s = q.toLowerCase();
  var list = records.filter(function (r) { return (type === 'All' || r.type === type) && (!s || r.search.indexOf(s) > -1 || r.title.toLowerCase().indexOf(s) > -1); });
  document.querySelector('[data-count]').textContent = list.length + (list.length === 1 ? ' interview guide' : ' interview guides');
  document.querySelector('[data-list]').innerHTML = list.length ? '<div class="journey-list">' + list.map(function (r) {
    var lg = logoFor(r.title, r.link);
    return '<article class="jcard" style="grid-template-columns:1fr"><div class="jcard__main"><div class="sch__head"><div class="logo">' + (lg.hasLogo ? '<img src="' + E(lg.logoSrc) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + E(lg.initials) + '\'">' : E(lg.initials)) + '</div>' +
      '<div><h3>' + E(r.title) + '</h3>' + (r.full && r.full !== r.title ? '<div class="muted" style="font-size:var(--fs-sm)">' + E(r.full) + '</div>' : '') + '</div></div>' +
      '<div class="row" style="gap:6px"><span class="tag tag--maroon">' + E(r.type) + '</span>' + (r.cycle ? '<span class="tag">' + E(r.cycle) + '</span>' : '') + '</div>' +
      (r.about ? '<p style="color:var(--ink-2);font-size:var(--fs-sm)">' + E(r.about) + '</p>' : '') +
      (r.take ? '<div class="quote" style="grid-template-columns:1fr"><div><cite style="margin:0 0 4px">Seniors’ takeaway</cite><blockquote>' + E(r.take) + '</blockquote></div></div>' : '') +
      (r.sections.length ? '<div class="faq">' + r.sections.map(function (x) { return '<div class="qa t-acc" data-open="false"><button class="qa__q" type="button"><span>' + E(x.label) + '</span></button><div class="t-acc-panel"><div class="t-acc-panel-inner"><div class="qa__a">' + lines(x.value) + '</div></div></div></div>'; }).join('') + '</div>' : '') +
      '<div class="row">' + (r.link ? '<a class="btn btn--ghost" href="' + E(r.link) + '" target="_blank" rel="noopener">' + I('messages-square') + 'Read seniors’ full accounts</a>' : '') + '<a class="btn" href="' + BOOK_URL + '" target="_blank" rel="noopener">' + I('mic') + 'Book a mock interview</a></div>' +
      '</div></article>';
  }).join('') + '</div>' : '<div class="empty">No interview guides match. Try another name, like PSC or A*STAR.</div>';
  ECG.initAccordions(document.querySelector('[data-list]'));
}
var BOOK_URL = 'https://for.edu.sg/vjcecgcappointment';
function start() {
  records = fromSummaries(); render();
  var s = ECG.sheet(SHEET_URL);
  var apply = function (d) { var r = build([d.head].concat(d.rows)); if (r.length) { records = r; render(); } };
  if (s.cached) apply(s.cached); s.fresh.then(apply).catch(function () { });
  document.querySelector('[data-q]').addEventListener('input', function (e) { q = e.target.value.trim(); render(); });
  document.querySelector('main').addEventListener('click', function (e) { var t = e.target.closest('[data-type]'); if (t) { type = t.getAttribute('data-type'); render(); } });
}
if (window.ECG) start(); else document.addEventListener('DOMContentLoaded', start);
})();
