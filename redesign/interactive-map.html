function normKey(s) { return (s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '').trim(); }
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;

const NODATA_SLOTS = [];

  }).join('') + (typeof NODATA_SLOTS !== 'undefined' ? NODATA_SLOTS.map(function (s) { return '<div class="booth booth--empty" style="grid-column:' + s.col + ';grid-row:' + s.row + '">' + E(s.label || '') + '</div>'; }).join('') : '') +
    [[6, 2], [7, 2], [6, 3], [7, 3], [6, 4], [7, 4], [6, 5], [7, 5]].map(function (f) { return '<div class="walkway" style="grid-column:' + f[0] + ';grid-row:' + f[1] + '" aria-hidden="true"></div>'; }).join('');

  var total = bs.filter(hit).length;

function openBooth(b) {

    '<h2 id="bt">' + E(b.n) + '</h2>' + (b.ind ? '<div class="muted">' + E(b.ind) + '</div>' : '') + (b.w ? '<p class="desc">' + E(b.w) + '</p>' : '') +
    '<div class="row">' + (href ? '<a class="btn btn--gold" href="' + E(href) + '" target="_blank" rel="noopener">Visit website' + I('arrow-up-right') + '</a>' : '') + '<a class="btn btn--ghost" ' + ECG.linkAttrs('partner-organisations') + '>See talks and partners</a></div>';

function start() {

    live = {}; rows.slice(1).forEach(function (r) { var o = r[io] && r[io].trim(); if (o) live[normKey(o)] = { n: o, link: il > -1 ? (r[il] || '').trim() : '', w: iw > -1 ? (r[iw] || '').trim() : '', logo: ig > -1 ? (r[ig] || '').trim() : '' }; });
    render();

  document.querySelector('[data-q]').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); render(); });

})();
