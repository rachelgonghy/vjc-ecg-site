<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:28px;padding-top:8px;border-top:1px solid #E7DBBE;margin-top:16px">
  <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ false }}">
      <a href="{{ prevFile }}" style="text-decoration:none;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:12px;background:#F4ECDA;max-width:280px">
        <span style="font-family:'Work Sans',sans-serif;font-size:12px;color:#7A6A5E;font-weight:600;letter-spacing:0.04em">← PREVIOUS</span>
        <span style="font-family:'Work Sans',sans-serif;font-size:14.5px;color:#241A15;font-weight:600">{{ prevTitle }}</span>
      </a>
    </sc-if>
    <sc-if value="{{ noPrev }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
    <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ false }}">
      <a href="{{ nextFile }}" style="text-decoration:none;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:12px;background:#F4ECDA;max-width:280px;text-align:right;margin-left:auto">
        <span style="font-family:'Work Sans',sans-serif;font-size:12px;color:#7A6A5E;font-weight:600;letter-spacing:0.04em">NEXT →</span>
        <span style="font-family:'Work Sans',sans-serif;font-size:14.5px;color:#241A15;font-weight:600">{{ nextTitle }}</span>
      </a>
    </sc-if>
  </div>
  <sc-if value="{{ showRelated }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Source Serif 4',Georgia,serif;font-size:1.125rem;font-weight:700;color:#241A15">Related Pages</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
        <sc-for list="{{ related }}" as="r" hint-placeholder-count="3">
          <a href="{{ r.file }}" style="text-decoration:none;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:#FFFFFF;border:1px solid #E7DBBE;box-shadow:0 2px 6px rgba(36,26,21,0.08)">
            <span style="font-family:'Work Sans',sans-serif;font-size:15px;font-weight:600;color:#8C151B">{{ r.title }}</span>
            <span style="font-family:'Work Sans',sans-serif;font-size:13px;color:#7A6A5E;line-height:1.4">{{ r.blurb }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activeKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { prev: null, next: null, related: [] };
  async componentDidMount() {
    let prevNext, siblingsOf, children;
    try {
      const mod = await import('./sitemap.js');
      prevNext = mod.prevNext; siblingsOf = mod.siblingsOf; children = mod.children;
    } catch (e) {
      const INLINE = [
        {key:'meet-the-team',title:'Meet the Team',file:'meet-the-team.dc.html',parentKey:null},
        {key:'opportunity-search-portal',title:'Opportunity Search Portal',file:'opportunity-search-portal.dc.html',parentKey:null},
        {key:'overseas-education-portal',title:'Overseas Education Portal',file:'overseas-education-portal.dc.html',parentKey:null},
        {key:'events-and-programmes',title:'Events & Programmes',file:'events-and-programmes.dc.html',parentKey:null},
        {key:'learning-journeys',title:'Learning Journeys',file:'learning-journeys.dc.html',parentKey:'events-and-programmes'},
        {key:'edvantage-fair',title:'EdVantage! Fair',file:'edvantage-fair.dc.html',parentKey:'events-and-programmes'},
        {key:'partner-organisations',title:'Partner Organisations',file:'partner-organisations.dc.html',parentKey:'edvantage-fair'},
        {key:'talk-allocation-portal',title:'Talk Allocation Portal',file:'talk-allocation-portal.dc.html',parentKey:'edvantage-fair'},
        {key:'interactive-map',title:'Interactive Map',file:'interactive-map.dc.html',parentKey:'edvantage-fair'},
        {key:'local-university-panel-discussion',title:'Local University Panel Discussion',file:'local-university-panel-discussion.dc.html',parentKey:'events-and-programmes'},
        {key:'project-edvantage',title:'Project EdVantage',file:'project-edvantage.dc.html',parentKey:'events-and-programmes'},
        {key:'jc1-work-shadowing-programme',title:'JC1 Work Shadowing Programme',file:'jc1-work-shadowing-programme.dc.html',parentKey:'events-and-programmes'},
        {key:'a-level-university-support',title:'A-Levels & University Applications',file:'a-level-university-support.dc.html',parentKey:null},
        {key:'start-here-university-applications',title:'Get Started Here',file:'https://sites.google.com/vjc.edu.sg/ecgvjc/a-level-and-university-applications/get-started-here',parentKey:'a-level-university-support'},
        {key:'sg-university-application',title:'Local University Applications',file:'sg-university-application-standalone.html',parentKey:'a-level-university-support',blurb:'Timelines and requirements for applying to Singapore universities.'},
        {key:'international-university-application',title:'International University Applications',file:'international-university-application-standalone.html',parentKey:'a-level-university-support',blurb:'Application routes for universities in the UK, US, EU and Asia.'},
        {key:'scholarship-information',title:'Scholarships & Interviews',file:'scholarship-information.dc.html',parentKey:null},
        {key:'pre-u-scholarships',title:'Pre-U Scholarships',file:'pre-u-scholarships.dc.html',parentKey:'scholarship-information'},
        {key:'undergraduate-scholarships',title:'Undergraduate Scholarships',file:'https://sites.google.com/vjc.edu.sg/ecgvjc/scholarships-and-interviews/undergraudate-scholarships',parentKey:'scholarship-information'},
        {key:'interview-prep',title:'Scholarship Interview Processes',file:'interview-prep.dc.html',parentKey:'scholarship-information'},
        {key:'useful-resources',title:'Useful Resources',file:'useful-resources.dc.html',parentKey:null},
        {key:'h2-degree-mapping-advisor',title:'H2 Degree Mapping Advisor',file:'h2-degree-mapping-advisor.dc.html',parentKey:'useful-resources'},
        {key:'h2-subject-eligibility-advisor',title:'H2 Subject Eligibility Advisor',file:'h2-subject-eligibility-advisor.dc.html',parentKey:'useful-resources'},
        {key:'rank-point-calculator',title:'Rank Points Calculator',file:'rank-point-calculator.dc.html',parentKey:'useful-resources'},
        {key:'ecg-chatbot',title:'ECG Chatbot',file:'ecg-chatbot.dc.html',parentKey:null},
        {key:'book-an-ecg-session',title:'Book an ECG Session',file:'book-an-ecg-session.dc.html',parentKey:null}
      ];
      const byKeyInline = (k) => INLINE.find(p => p.key === k);
      children = (k) => INLINE.filter(p => p.parentKey === k);
      siblingsOf = (k) => { const node = byKeyInline(k); if (!node) return []; return node.parentKey ? children(node.parentKey) : INLINE.filter(p => p.parentKey === null); };
      prevNext = (k) => { const sibs = siblingsOf(k); const idx = sibs.findIndex(p => p.key === k); return { prev: idx > 0 ? sibs[idx - 1] : null, next: (idx >= 0 && idx < sibs.length - 1) ? sibs[idx + 1] : null }; };
    }
    const activeKey = this.props.activeKey || '';
    const { prev, next } = prevNext(activeKey);
    const kids = children(activeKey);
    let related = kids.length ? kids : siblingsOf(activeKey).filter(p => p.key !== activeKey);
    related = related.slice(0, 3);
    this.setState({ prev, next, related });
    try {
      const linkMap = await this.fetchNavLinks();
      const patch = p => p ? { ...p, file: linkMap.get(p.title.toLowerCase()) || p.file } : p;
      this.setState({
        prev: patch(prev),
        next: patch(next),
        related: related.map(patch)
      });
    } catch (e) { /* keep internal links on any fetch error */ }
  }
  async fetchNavLinks() {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTen3StJgYixVUyyyLv7GMUVm-0QaRLxEL_fXPSNPhqBFOcfJ9v0LOTJNV0y3U3gMb7uRZhNys5aRe-/pub?gid=0&single=true&output=csv&_ts=" + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = text.trim().split('\n').map(r => this.parseCSVLine(r));
    const headers = rows[0].map(h => h.trim().toLowerCase());
    const mainIdx = headers.indexOf('main page');
    const subIdx = headers.indexOf('subpage');
    const linkIdx = headers.indexOf('website page');
    const map = new Map();
    rows.slice(1).forEach(r => {
      const main = (r[mainIdx] || '').trim();
      const sub = (r[subIdx] || '').trim();
      const link = (r[linkIdx] || '').trim();
      if (!link) return;
      const title = (!sub || sub === '-') ? main : sub;
      if (title) map.set(title.toLowerCase(), link);
    });
    return map;
  }
  parseCSVLine(line) {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQ) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQ = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }
  renderVals() {
    return {
      hasPrev: !!this.state.prev, noPrev: !this.state.prev,
      hasNext: !!this.state.next,
      prevFile: this.state.prev ? this.state.prev.file : '#',
      prevTitle: this.state.prev ? this.state.prev.title : '',
      nextFile: this.state.next ? this.state.next.file : '#',
      nextTitle: this.state.next ? this.state.next.title : '',
      showRelated: this.state.related.length > 0 && !this.props.hideRelated,
      related: this.state.related
    };
  }
}
</script>
</body>
</html>
