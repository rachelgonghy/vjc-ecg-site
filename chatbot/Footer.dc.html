<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#2E0507;padding:40px 24px;display:flex;flex-direction:column;gap:24px">
  <div style="max-width:1200px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:32px 40px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:160px">
        <a href="{{ g.file }}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:700;color:#F0CD6B">{{ g.title }}</a>
        <sc-for list="{{ g.children }}" as="c" hint-placeholder-count="2">
          <a href="{{ c.file }}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;font-family:'Work Sans',sans-serif;font-size:13px;color:rgba(251,247,239,0.75)">{{ c.title }}</a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="max-width:1200px;margin:0 auto;width:100%;border-top:1px solid rgba(251,247,239,0.15);padding-top:16px;font-family:'Work Sans',sans-serif;font-size:12.5px;color:rgba(251,247,239,0.55)">
    Education &amp; Career Guidance @ Victoria Junior College
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { groups: [] };
  async componentDidMount() {
    const inlineTop = [
      {key:'opportunity-search-portal',title:'Opportunity Search Portal',file:'opportunity-search-portal.dc.html'},
      {key:'overseas-education-portal',title:'Overseas Education Portal',file:'overseas-education-portal.dc.html'},
      {key:'events-and-programmes',title:'Events & Programmes',file:'events-and-programmes.dc.html'},
      {key:'a-level-university-support',title:'A-Levels & University Applications',file:'a-level-university-support.dc.html'},
      {key:'scholarship-information',title:'Scholarships & Interviews',file:'scholarship-information.dc.html'},
      {key:'useful-resources',title:'Useful Resources',file:'useful-resources.dc.html'},
      {key:'ecg-chatbot',title:'ECG Chatbot',file:'ecg-chatbot.dc.html'},
      {key:'book-an-ecg-session',title:'Book an ECG Session',file:'book-an-ecg-session.dc.html'}
    ];
    const inlineChildren = {
      'events-and-programmes': [
        {key:'learning-journeys',title:'Learning Journeys',file:'learning-journeys.dc.html'},
        {key:'edvantage-fair',title:'EdVantage! Fair',file:'edvantage-fair.dc.html'},
        {key:'local-university-panel-discussion',title:'Local University Panel Discussion',file:'local-university-panel-discussion.dc.html'},
        {key:'project-edvantage',title:'Project EdVantage',file:'project-edvantage.dc.html'},
        {key:'jc1-work-shadowing-programme',title:'JC1 Work Shadowing Programme',file:'jc1-work-shadowing-programme.dc.html'}
      ],
      'edvantage-fair': [
        {key:'partner-organisations',title:'Partner Organisations',file:'partner-organisations.dc.html'},
        {key:'talk-allocation-portal',title:'Talk Allocation Portal',file:'talk-allocation-portal.dc.html'},
        {key:'interactive-map',title:'Interactive Map',file:'interactive-map.dc.html'}
      ],
      'a-level-university-support': [
        {key:'start-here-university-applications',title:'Start Here',file:'https://sites.google.com/vjc.edu.sg/ecgvjc/a-level-and-university-applications/get-started-here'},
        {key:'sg-university-application',title:'Local University Application',file:'sg-university-application-standalone.html'},
        {key:'international-university-application',title:'International University Application',file:'international-university-application-standalone.html'}
      ],
      'scholarship-information': [
        {key:'pre-u-scholarships',title:'Pre-U Scholarships',file:'pre-u-scholarships.dc.html'},
        {key:'undergraduate-scholarships',title:'Undergraduate Scholarships',file:'https://sites.google.com/vjc.edu.sg/ecgvjc/scholarships-and-interviews/undergraudate-scholarships'},
        {key:'interview-prep',title:'Scholarship Interview Processes',file:'interview-prep.dc.html'}
      ],
      'useful-resources': [
        {key:'h2-degree-mapping-advisor',title:'H2 Degree Mapping Advisor',file:'h2-degree-mapping-advisor.dc.html'},
        {key:'h2-subject-eligibility-advisor',title:'H2 Subject Eligibility Advisor',file:'h2-subject-eligibility-advisor.dc.html'},
        {key:'rank-point-calculator',title:'Rank Points Calculator',file:'rank-point-calculator.dc.html'}
      ]
    };
    let topLevel = () => inlineTop;
    let children = (key) => inlineChildren[key] || [];
    try {
      const mod = await import('./sitemap.js');
      topLevel = mod.topLevel;
      children = mod.children;
    } catch (e) { /* sitemap.js unavailable in standalone export; use inline fallback */ }
    const fallback = topLevel().filter(p => !p.navHidden).map(p => ({ title: p.title, file: p.file, children: children(p.key) }));
    this.setState({ groups: fallback });
    try {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTen3StJgYixVUyyyLv7GMUVm-0QaRLxEL_fXPSNPhqBFOcfJ9v0LOTJNV0y3U3gMb7uRZhNys5aRe-/pub?gid=0&single=true&output=csv&_ts=" + Date.now();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => this.parseCSVLine(r));
      const headers = rows[0].map(h => h.trim().toLowerCase());
      const mainIdx = headers.indexOf('main page');
      const subIdx = headers.indexOf('subpage');
      const linkIdx = headers.indexOf('website page');
      const groupMap = new Map();
      rows.slice(1).forEach(r => {
        const main = (r[mainIdx] || '').trim();
        const sub = (r[subIdx] || '').trim();
        const link = (r[linkIdx] || '').trim();
        if (!main) return;
        if (!groupMap.has(main)) groupMap.set(main, { title: main, file: '#', children: [] });
        const g = groupMap.get(main);
        if (!sub || sub === '-') { if (link) g.file = link; }
        else if (link) g.children.push({ title: sub, file: link });
        else { const pageMatch = fallback.find(p => p.title.toLowerCase() === main.toLowerCase()); const fb = pageMatch ? children(pageMatch.key) : []; const match = fb.find(c => c.title.toLowerCase() === sub.toLowerCase()); g.children.push({ title: sub, file: match ? match.file : '#' }); }
      });
      const groups = Array.from(groupMap.values()).filter(g => g.title !== 'Home');
      if (groups.length) this.setState({ groups });
    } catch (e) {
      // keep fallback groups on any fetch error
    }
  }
  parseCSVLine(line) {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQ) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQ = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }
  renderVals() {
    return { groups: this.state.groups };
  }
}
</script>
</body>
</html>
