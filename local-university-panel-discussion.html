  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"82327501-d30a-4d94-9b31-9aff1183080f\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<script src=\"7c031ac9-2bbf-4bc7-9b3c-46735ae9ab21\"><\u002Fscript>\n<script>(function(){if(document.getElementById('vjc-fonts'))return;var d=document,h=d.head;['https://fonts.googleapis.com','https://fonts.gstatic.com'].forEach(function(u,i){var p=d.createElement('link');p.rel='preconnect';p.href=u;if(i)p.crossOrigin='';h.appendChild(p);});var l=d.createElement('link');l.id='vjc-fonts';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Work+Sans:wght@400;500;600;700&display=swap';h.appendChild(l);})();<\u002Fscript><style>body{margin:0;background:#FBF7EF}a{color:#8C151B}a:hover{color:#48090C}<\u002Fstyle>\n<script src=\"b0f5e4eb-f3c7-4845-96ce-0966d4045565\"><\u002Fscript>\n<style>@media (max-width:700px){main a,.vjc-tap a{position:relative}main a::after{content:\"\";position:absolute;inset:-8px -2px}}<\u002Fstyle>\n<\u002Fhelmet>\n<dc-import name=\"QuickActions\" hint-size=\"1px,1px\"><\u002Fdc-import>\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;box-sizing:border-box\">\n  <dc-import name=\"Sidebar\" active-key=\"local-university-panel-discussion\" hint-size=\"230px,300px\"><\u002Fdc-import>\n  <main style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:28px;padding:28px 0 48px\">\n    <dc-import name=\"Breadcrumb\" active-key=\"local-university-panel-discussion\" hint-size=\"100%,20px\"><\u002Fdc-import>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h1 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:2.25rem;font-weight:700;margin:0;color:#241A15\">Local University Panel Discussion<\u002Fh1>\n      <p style=\"font-family:'Work Sans',sans-serif;font-size:1.125rem;line-height:1.55;color:#4A3A31;max-width:none;margin:0\">Hear from representatives of all six local universities on admissions and higher education.<\u002Fp>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasBanner }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#D6A017;color:#2E0507;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;line-height:1.45;padding:10px 16px;border-radius:8px\">{{ banner }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <section style=\"background:#FFFFFF;border:1px solid #E7DBBE;border-radius:14px;box-shadow:0 2px 6px rgba(36,26,21,0.08);overflow:hidden\">\n      <div style=\"background:#48090C;padding:16px 22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#F0CD6B\">Date<\u002Fspan>\n        <span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.5rem;font-weight:700;color:#FBF7EF\">{{ date }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasPersons }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:2px;padding:16px 22px;background:#FBEACB\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Persons involved<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#241A15\">{{ persons }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ schedule }}\" as=\"s\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 20px;padding:16px 22px;border-top:1px solid #F0E6CF\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Time<\u002Fspan>\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#241A15\">{{ s.time }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Segment<\u002Fspan>\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#8C151B\">{{ s.name }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ s.persons }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Persons involved<\u002Fspan>\n                <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#241A15\">{{ s.persons }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Venue<\u002Fspan>\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#241A15\">{{ s.venue }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <image-slot id=\"uni-panel-photo-1\" style=\"width:100%;aspect-ratio:16/11\" shape=\"rounded\" radius=\"14\" placeholder=\"Panel discussion on stage\" src=\"ba9a13b5-acb1-4530-af88-cc9519b0884a\"><\u002Fimage-slot>\n      <image-slot id=\"uni-panel-photo-2\" style=\"width:100%;aspect-ratio:16/11\" shape=\"rounded\" radius=\"14\" placeholder=\"Parent interaction at booths\" src=\"ea5b265a-357d-4807-8da7-664622cb9efa\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <p style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.7;color:#4A3A31;margin:0\">Every October, VJC welcomes JC1 students and their parents to the Local University Fair, offering an opportunity to gain a clearer understanding of university admissions and the evolving higher education landscape.<\u002Fp>\n      <p style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.7;color:#4A3A31;margin:0\">The fair features a panel discussion with representatives from all six local autonomous universities, who share insights into university pathways, admissions and opportunities. Students and parents can also visit university booths in the concourse for more personalised conversations.<\u002Fp>\n      <p style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.7;color:#4A3A31;margin:0\">A lively Q&amp;A segment gives students the opportunity to raise questions and gain first-hand insights to make more informed decisions on their higher education journey.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.5rem;font-weight:700;margin:0;color:#241A15\">Before you attend<\u002Fh2>\n      <div style=\"background:#FBEACB;border-radius:10px;padding:12px 16px;font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.55;color:#48090C;font-weight:500\">{{ note }}<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <sc-for list=\"{{ unis }}\" as=\"u\" hint-placeholder-count=\"6\">\n          <div style=\"background:#FFFFFF;border:1px solid #E7DBBE;border-radius:14px;box-shadow:0 2px 6px rgba(36,26,21,0.08);padding:20px;display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.125rem;font-weight:700;color:#241A15;line-height:1.3\">{{ u.name }}<\u002Fspan>\n            <p style=\"font-family:'Work Sans',sans-serif;font-size:14px;line-height:1.6;color:#4A3A31;margin:0\">{{ u.description }}<\u002Fp>\n            <sc-if value=\"{{ u.hasTopics }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;border-top:1px solid #F0E6CF;padding-top:12px;margin-top:2px\">\n                <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#7A6A5E\">Topics to read<\u002Fspan>\n                <sc-for list=\"{{ u.topics }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <sc-if value=\"{{ t.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a href=\"{{ t.link }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:flex;align-items:flex-start;gap:8px;min-height:32px;padding:6px 0;text-decoration:none;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;color:#8C151B;line-height:1.4\"><span style=\"color:#D6A017\">→<\u002Fspan><span>{{ t.title }}<\u002Fspan><\u002Fa>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <sc-if value=\"{{ u.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"{{ u.link }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"align-self:flex-start;text-decoration:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:#8C151B;color:#FBF7EF;font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600\">Visit website ↗<\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"BottomNav\" active-key=\"local-university-panel-discussion\" hint-size=\"100%,200px\"><\u002Fdc-import>\n  <\u002Fmain>\n<\u002Fdiv>\n<dc-import name=\"Footer\" hint-size=\"100%,220px\"><\u002Fdc-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGFLCh35smqhtLsTYWvFSrGYTXC8VVyNXDxAbpkl0zOzm2OsfWX88INA_lRx4O926RjhMvrle0-Zok/pub?gid=0&single=true&output=csv';\n\nconst FALLBACK = {\n  banner: 'Do note that parents have been invited to this event via an announcement on Parents Gateway',\n  persons: '',\n  date: 'Friday, 16 October 2026',\n  schedule: [\n    { name: 'University Booths', time: '4:00 to 5.30PM', persons: 'Parents and JC1 Students', venue: 'Concourse' },\n    { name: 'University Panel Q&A', time: '5.30 to 7.00PM', persons: 'Parents and JC1 Students', venue: 'Hall' }\n  ],\n  note: 'Please read up on these materials with your parents before attending the University Panel Discussion.',\n  unis: [\n    { name: 'National University of Singapore (NUS)', description: \"NUS is Singapore's flagship comprehensive university, offering a broad range of programmes across disciplines including business, computing, engineering, medicine, law, science and the humanities and social sciences. It combines rigorous academic education with opportunities for research, innovation, entrepreneurship and global exposure.\", link: 'https://nus.edu.sg/', topics: [{\"title\":\"Undergraduate Admissions\",\"link\":\"https://nus.edu.sg/oam\"},{\"title\":\"Admissions, Scholarships and Financial Aid\",\"link\":\"https://nus.edu.sg/oam#undergrad-admission-publication\"},{\"title\":\"(Video) NUS and admissions\",\"link\":\"https://www.youtube.com/@NUSAdmissions/videos\"}] },\n    { name: 'Nanyang Technological University (NTU)', description: 'NTU is a research-intensive university known for its strengths in engineering, technology, business, science and the humanities and social sciences. With a strong focus on innovation and interdisciplinary learning, NTU provides students with opportunities to engage in research, industry projects and global experiences.', link: 'https://www.ntu.edu.sg/', topics: [{\"title\":\"eBrochures across all Degrees\",\"link\":\"https://drive.google.com/drive/folders/1OWGSYnyTuF51KEsp-uSyA-pXqSn968EX?usp=sharing\"}] },\n    { name: 'Singapore Management University (SMU)', description: 'SMU is a city-based university with a distinctive focus on business, management, social sciences, computing and law. Its interactive seminar-style teaching, interdisciplinary curriculum and strong industry connections prepare students to think critically, communicate effectively and apply their knowledge to real-world challenges.', link: 'https://www.smu.edu.sg/', topics: [{\"title\":\"E-Resource Sheet\",\"link\":\"https://drive.google.com/drive/folders/1fmdGg9HH38rX4IlRwKQlTrQPb1ENdenS?usp=sharing\"}] },\n    { name: 'Singapore Institute of Technology (SIT)', description: \"SIT is Singapore's university of applied learning, offering industry-focused programmes designed to connect academic knowledge with professional practice. Students gain hands-on experience through applied learning, work placements and industry projects, preparing them for careers in areas such as engineering, health sciences, computing, business and design.\", link: 'https://www.singaporetech.edu.sg/', topics: [{\"title\":\"SIT Scholarship and Financial Aid\",\"link\":\"https://www.youtube.com/watch?v=ZfkqLfb0AV4\"}] },\n    { name: 'Singapore University of Technology and Design (SUTD)', description: 'SUTD focuses on technology, design and innovation, integrating engineering, computing, architecture and design with a strong emphasis on interdisciplinary problem-solving. Its hands-on curriculum encourages students to develop creative solutions to complex technological and societal challenges.', link: 'https://www.sutd.edu.sg/', topics: [{\"title\":\"(Video) The World's First Design AI University\",\"link\":\"https://www.youtubeeducation.com/watch?v=NQvj2Fh1oM8\"},{\"title\":\"(Video) What makes SUTD Unique?\",\"link\":\"https://www.youtubeeducation.com/watch?v=MO2vyHoE9fM\"},{\"title\":\"(Video) SUTD 101: Our 5 Majors in a Nutshell\",\"link\":\"https://www.youtubeeducation.com/watch?v=uJAwjF5lKMc\"},{\"title\":\"(Video) SUTD-Nuke NUS Medical School's MD Programme\",\"link\":\"https://www.youtubeeducation.com/watch?v=fp5TBwnq9Zo\"},{\"title\":\"Scholarships\",\"link\":\"https://www.sutd.edu.sg/admissions/undergraduate/scholarship/sutd-administered/\"},{\"title\":\"Financial Options & Aid\",\"link\":\"https://www.sutd.edu.sg/admissions/undergraduate/financing-options-and-aid/#tabs\"},{\"title\":\"eBrochures across all Degrees\",\"link\":\"https://drive.google.com/drive/folders/1FrMCZULLv4iz2jslMlCBic_RqLCCbSBI?usp=sharing\"}] },\n    { name: 'Singapore University of Social Sciences (SUSS)', description: 'SUSS specialises in applied and lifelong learning, with programmes spanning business, social sciences, human development, law, communication and related fields. Its flexible, practice-oriented approach connects academic learning with real-world applications and prepares students for evolving careers and continued learning.', link: 'https://www.suss.edu.sg/', topics: [{\"title\":\"Introduction to SUSS\",\"link\":\"https://drive.google.com/file/d/19-wPTfQsnwlCtOGWDAMuhOZSYxvOsgum/view?usp=sharing\"},{\"title\":\"Parents' Flyer\",\"link\":\"https://drive.google.com/file/d/1h7WnjFKJ2_fNIguiSxLsMXUhpl-k_ijA/view?usp=sharing\"},{\"title\":\"eBrochure for all Degrees\",\"link\":\"https://drive.google.com/file/d/1PANPy2gzOZvZ_CzMHN1KpUwTnPREK9Rl/view?usp=sharing\"}] }\n  ]\n};\n\nfunction parseCSV(text) {\n  const rows = []; let row = []; let cur = ''; let q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) {\n      if (c === '\"' && text[i + 1] === '\"') { cur += '\"'; i++; }\n      else if (c === '\"') q = false;\n      else cur += c;\n    } else if (c === '\"') q = true;\n    else if (c === ',') { row.push(cur); cur = ''; }\n    else if (c === '\\n') { row.push(cur); rows.push(row); row = []; cur = ''; }\n    else if (c !== '\\r') cur += c;\n  }\n  if (cur || row.length) { row.push(cur); rows.push(row); }\n  return rows.map(r => r.map(x => x.trim()));\n}\n\nfunction fromSheet(rows) {\n  const out = { banner: '', date: '', persons: '', schedule: [], note: '', unis: [] };\n  let inUnis = false;\n  for (const r of rows) {\n    const [a = '', b = '', c = '', d = '', e = ''] = r;\n    if (!a && !b && !c && !d && !e) continue;\n    const key = a.toLowerCase();\n    if (key === 'university' && b.toLowerCase() === 'description') { inUnis = true; continue; }\n    if (inUnis) {\n      if (a) out.unis.push({ name: a, description: b, link: c, topics: [] });\n      const cur = out.unis[out.unis.length - 1];\n      if (cur && d) cur.topics.push({ title: d.replace(/\\s+/g, ' ').trim(), link: e });\n      continue;\n    }\n    if (key === 'sticky banner') { out.banner = b; continue; }\n    if (key === 'date') { out.date = b; continue; }\n    if (key === 'persons involved') { out.persons = b; continue; }\n    if (!b && !c) { out.note = a; continue; }\n    out.schedule.push(d ? { name: a, time: b, persons: c, venue: d } : { name: a, time: b, persons: '', venue: c });\n  }\n  return out;\n}\n\nclass Component extends DCLogic {\n  state = { data: FALLBACK };\n  componentDidMount() {\n    this.load();\n    this._t = setInterval(() => this.load(), 2 * 60 * 1000);\n    this._v = () => { if (document.visibilityState === 'visible') this.load(); };\n    document.addEventListener('visibilitychange', this._v);\n  }\n  componentWillUnmount() {\n    clearInterval(this._t);\n    document.removeEventListener('visibilitychange', this._v);\n  }\n  async load() {\n    try {\n      const res = await fetch(SHEET_URL + '&_ts=' + Date.now(), { cache: 'no-store' });\n      if (!res.ok) return;\n      const d = fromSheet(parseCSV(await res.text()));\n      if (d.unis.length || d.schedule.length) this.setState({ data: { ...FALLBACK, ...Object.fromEntries(Object.entries(d).filter(([k, v]) => Array.isArray(v) ? v.length : v)) } });\n    } catch (e) { /* keep fallback */ }\n  }\n  renderVals() {\n    const d = this.state.data;\n    const isUrl = s => /^https?:/i.test((s || '').trim());\n    return {\n      banner: d.banner || '',\n      hasBanner: !!d.banner,\n      date: d.date,\n      persons: d.persons || '',\n      hasPersons: !!d.persons,\n      schedule: d.schedule,\n      note: d.note,\n      unis: d.unis.map(u => {\n        const topics = (u.topics || []).map(t => ({ title: t.title, link: (t.link || '').trim(), hasLink: isUrl(t.link) }));\n        return { ...u, link: (u.link || '').trim(), hasLink: isUrl(u.link), topics, hasTopics: topics.length > 0 };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
