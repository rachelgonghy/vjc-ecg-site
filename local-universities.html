document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    let bin = '';

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

translate .12s ease-out,box-shadow .12s ease-out,background-color .12s ease-out}\n.ecg-site-sidebar>a[style*=\"border-left: 2px solid\"]::after{content:\"\\2192\";flex:none;color:var(--lb-m);font-weight:900;transition:translate .12s ease-out}\n@media (hover:hover){\n  .ecg-site-sidebar>a[style*=\"border-left: 2px solid\"]:hover{translate:0 -2px;box-shadow:3px 4px 0 var(--lb-ink);background:var(--lb-g-soft)!important;opacity:1}\n  .ecg-site-sidebar>a[style*=\"border-left: 2px solid\"]:hover::after{translate:3px 0}}\n.ecg-site-sidebar>a[style*=\"border-left: 2px solid\"]:active{translate:2px 2px;box-shadow:0 0 0 var(--lb-ink)}\n.ecg-site-sidebar>a[style*=\"border-left: 2px solid\"]:focus-visible{outline:3px solid var(--lb-m);outline-offset:2px}\n/* the page you are on */\n.ecg-site-sidebar>a[style*=\"background: rgb(251, 234, 203)\"]{background:var(--lb-m)!important;color:#fff!important;font-weight:800!important}\n.ecg-site-sidebar>a[style*=\"background: rgb(251, 234, 203)\"]::after{content:\"\\25CF\";color:var(--lb-g);font-size:11px}\n@media (hover:hover){.ecg-site-sidebar>a[style*=\"background: rgb(251, 234, 203)\"]:hover{background:var(--lb-m)!important}}\n\n/* Cards ease in as they scroll into view (theme.js adds lb-reveal). Short, and never blocks reading. */\n.lb-reveal{animation:lb-rise .32s ease-out both}\n@keyframes lb-rise{from{opacity:.001;translate:0 10px}to{opacity:1;translate:0 0}}\n\n/* The six bears (homepage): pop in one after another, then gently bob */\n.lb-crew{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 0;align-items:flex-end}\n.lb-bear{display:block;width:clamp(64px,13vw,128px);border:2.5px solid var(--lb-ink);border-radius:18px;box-shadow:3px 3px 0 var(--lb-ink);overflow:hidden;\n  animation:lb-pop .4s cubic-bezier(.2,1.5,.4,1) both,lb-bob 3.2s ease-in-out .5s infinite;transition:scale .15s ease-out}\n.lb-bear img{display:block;width:100%;height:auto}\n.lb-bear:nth-child(odd){rotate:-3deg}.lb-bear:nth-child(even){rotate:3deg}\n.lb-bear:nth-child(2){animation-delay:.06s,.9s}.lb-bear:nth-child(3){animation-delay:.12s,1.3s}.lb-bear:nth-child(4){animation-delay:.18s,1.7s}\n.lb-bear:nth-child(5){animation-delay:.24s,2.1s}.lb-bear:nth-child(6){animation-delay:.3s,2.5s}\n@media (hover:hover){.lb-bear:hover{scale:1.08;rotate:0deg}}\n@keyframes lb-pop{from{opacity:.001;scale:.6}to{opacity:1;scale:1}}\n@keyframes lb-bob{0%,100%{translate:0 0}50%{translate:0 -5px}}\n\n@media (prefers-reduced-motion:reduce){\n  .lb-bear,.lb-reveal{animation:none!important}\n  *{transition:none!important}\n  [style*=\"display: grid\"]>*{rotate:0deg!important}\n}\n<\u002Fstyle><script id=\"lb-theme-js\">/* La Bear theme script.\n   Every page: cards ease in as they scroll into view (IntersectionObserver: no scroll listeners, no layout work).\n   Homepage only: marks <html class=\"lb-home\"> for the full look and adds the six-bear crew under the welcome text.\n   Nothing is hidden before it animates, so content never waits on this script. */\n(function () {\n  if (window.__lbTheme) return; window.__lbTheme = 1;\n  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();\n  var home = page === '' || page === 'index.html' || page === 'home.html';\n  if (home) document.documentElement.classList.add('lb-home');\n\n  var BEARS = { S: ['#DAE7C6', 'Supper Kaki Bear'], I: ['#D5DFF3', '47 Tabs Bear'], A: ['#FBD0D0', 'Class Shirt Bear'],\n    C: ['#D7ECD7', 'Group Chat Admin Bear'], E: ['#FCDCCE', 'Pasar Malam Bear'], R: ['#F9E4C3', 'No Manual Bear'] };\n  function bear(t) {\n    var d = document.createElement('span'); d.className = 'lb-bear'; d.style.background = BEARS[t][0];\n    var i = document.createElement('img'); i.src = 'labear/art/' + t + '.webp'; i.alt = BEARS[t][1]; i.decoding = 'async';\n    d.appendChild(i); return d;\n  }\n\n  // Cards below the first screen ease in when they arrive. Cards already on screen are left alone.\n  var io = (!reduce && 'IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {\n    entries.forEach(function (e) {\n      if (e.isIntersecting) { e.target.classList.add('lb-reveal'); io.unobserve(e.target); }\n    });\n  }, { rootMargin: '0px 0px -40px 0px' }) : null;\n  var seen = typeof WeakSet === 'function' ? new WeakSet() : null;\n  function watchCards() {\n    if (!io || !seen) return;\n    var cards = document.querySelectorAll('[style*=\"display: grid\"] > *');\n    for (var i = 0; i < cards.length; i++) {\n      var c = cards[i]; if (seen.has(c)) continue; seen.add(c);\n      if (c.getBoundingClientRect().top > innerHeight) io.observe(c);\n    }\n  }\n\n  var tries = 0, iv = setInterval(function () {\n    var h1 = document.querySelector('h1');\n    // A few pages write their title as a big serif <div> instead of <h1>: mark the first one so it gets the gold highlight too.\n    var alt = h1 ? null : document.querySelector('div[style*=\"var(--font-serif-display)\"][style*=\"font-size: 2.25rem\"]');\n    tries++;\n    if (!h1 && !alt && tries < 60) return;\n    clearInterval(iv);\n    var title = h1 || alt; if (title) title.classList.add('lb-title'); // only the first title on the page gets the gold highlight\n    watchCards(); setTimeout(watchCards, 1500); // pages that load their lists a little later\n    if (home && h1 && !document.querySelector('.lb-crew')) {\n      var crew = document.createElement('div'); crew.className = 'lb-crew'; crew.setAttribute('aria-hidden', 'true');\n      ['S', 'I', 'A', 'C', 'E', 'R'].forEach(function (t) { crew.appendChild(bear(t)); });\n      h1.parentNode.appendChild(crew);\n    }\n  }, 100);\n})();\n<\u002Fscript><!--/LB-THEME--><\u002Fhelmet>\n<dc-import name=\"QuickActions\" hint-size=\"1px,1px\"><\u002Fdc-import>\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;box-sizing:border-box\">\n  <dc-import name=\"Sidebar\" active-key=\"sg-university-application\" hint-size=\"230px,300px\"><\u002Fdc-import>\n  <main style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:24px;padding-top:28px\">\n    <dc-import name=\"Breadcrumb\" active-key=\"sg-university-application\" hint-size=\"100%,20px\"><\u002Fdc-import>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h1 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:2.25rem;font-weight:700;margin:0;color:#241A15;line-height:1.15\">Local University Applications<\u002Fh1>\n      <p style=\"font-family:'Work Sans',sans-serif;font-size:1.125rem;line-height:1.55;color:#4A3A31;margin:0;text-wrap:pretty\">Each university's aptitude-based assessment (ABA) questions, and what seniors say to expect at the interview. Pick a university below.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasShift }}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-label=\"What universities look for\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.375rem;font-weight:700;margin:0;color:#241A15\">What universities look for has changed<\u002Fh2>\n          <sc-if value=\"{{ shift.hasScope }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:'Work Sans',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#48090C;background:#FBEACB;padding:4px 10px;border-radius:999px\">{{ shift.scope }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px;background:#F4ECDA;border:1px solid #E7DBBE;border-radius:14px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#7A6A5E\">{{ shift.before.tag }}<\u002Fspan>\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:#4A3A31\">{{ shift.before.title }}<\u002Fspan>\n            <\u002Fdiv>\n            <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ shift.before.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <li style=\"display:flex;gap:10px;align-items:flex-start;font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.5;color:#4A3A31\"><span style=\"flex-shrink:0;width:6px;height:6px;border-radius:50%;background:#A99C8F;margin-top:8px\"><\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px;background:#FFFFFF;border:1px solid #8C151B;border-top:4px solid #D6A017;border-radius:14px;box-shadow:0 2px 6px rgba(36,26,21,0.08)\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#8C650D\">{{ shift.after.tag }}<\u002Fspan>\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:700;color:#8C151B\">{{ shift.after.title }}<\u002Fspan>\n            <\u002Fdiv>\n            <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ shift.after.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <li style=\"display:flex;gap:10px;align-items:flex-start;font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.5;color:#241A15\"><span style=\"flex-shrink:0;width:6px;height:6px;border-radius:50%;background:#D6A017;margin-top:8px\"><\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section aria-label=\"Before you apply\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <h2 style=\"font-family:'Work Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#7A6A5E;margin:0\">Before you apply<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Pre-requisites &amp; IGPs<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">Some courses need specific H2 subjects. IGPs show last year's cut-offs, as a guide only.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/1drnTRtYvLPg1Kce-yZswg-jcQebihiHa/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Pre-requisites &amp; IGPs ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Visit open houses<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">Held around results day in February. Talk to current students and admissions staff.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/1nbftQ_459TGuwOc40p5-ZEssqs5kF0RN/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Open house dates ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Thinking about Medicine?<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">There are extra steps for NUS and NTU Medicine. Check them early.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/14PNIqWvmnTWQeEsd7T1Jru15e61d5_3g/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Medicine to-do list ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Myths &amp; FAQs<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">Common worries about A-Level results and applying, answered.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/1O4SmO_WIDUBqLtZ7jqpt72H66pnXQh9j/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Myths &amp; FAQs ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Other pathways<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">Polytechnics, part-time study at SUSS, and what to weigh up before a private university.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/1z0VIwM9T2u2arXWYpkiuZwgyi3TrzdiR/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Alternative pathways ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:12px\">\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:700;color:#241A15\">Applying for scholarships too?<\u002Fspan>\n          <span style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;line-height:1.5;color:#4A3A31;flex:1\">Deadlines often overlap with university ones. Plan ahead and give your tutors notice.<\u002Fspan>\n          <a href=\"https://drive.google.com/file/d/1d8cpnMHbwPM_RM189N8PDUPmhJUORcf2/view\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content;margin-top:4px\">Scholarship timelines ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n  <dc-import name=\"PageLoader\" message=\"Loading local university information…\" hint-size=\"1px,1px\"><\u002Fdc-import>\n<\u002Fsc-if>\n\n    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px;border-radius:14px;background:#FFFFFF;border:1px solid #E7DBBE;font-family:'Work Sans',sans-serif;font-size:15px;color:#4A3A31;line-height:1.55\">The university questions couldn't load right now. Please refresh the page in a moment.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReady }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div role=\"tablist\" aria-label=\"Choose a university\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button role=\"tab\" aria-selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;padding:9px 18px;min-height:40px;white-space:nowrap;border-radius:999px;cursor:pointer;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <article style=\"display:flex;flex-direction:column;border-radius:14px;background:#FFFFFF;border:1px solid #E7DBBE;box-shadow:0 2px 6px rgba(36,26,21,0.08);overflow:hidden\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 24px 18px;border-bottom:1px solid #F0E6D0\">\n            <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.5rem;font-weight:700;margin:0;color:#8C151B\">{{ uni.name }}<\u002Fh2>\n            <sc-if value=\"{{ uni.hasEntry }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-family:'Work Sans',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#48090C;background:#FBEACB;padding:4px 10px;border-radius:999px\">{{ uni.entryLabel }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <section style=\"display:flex;flex-direction:column;gap:14px;padding:20px 24px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <h3 style=\"font-family:'Work Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#7A6A5E;margin:0\">Aptitude-Based Assessment (ABA) Questions<\u002Fh3>\n            <\u002Fdiv>\n            <sc-if value=\"{{ uni.hasIntro }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;line-height:1.6;color:#4A3A31;margin:0;padding:12px 14px;background:#FBF7EF;border-radius:8px\">{{ uni.intro }}<\u002Fp>\n            <\u002Fsc-if>\n            <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ uni.questions }}\" as=\"qn\" hint-placeholder-count=\"4\">\n                <li style=\"display:flex;gap:14px;align-items:flex-start\">\n                  <span style=\"flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#8C151B;color:#FBF7EF;font-family:'Work Sans',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px\">{{ qn.num }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px\">\n                    <span style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.6;color:#241A15;text-wrap:pretty\">{{ qn.text }}<\u002Fspan>\n                    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                      <sc-if value=\"{{ qn.hasLimit }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;color:#4A3A31;background:#F4ECDA;padding:3px 10px;border-radius:999px\">{{ qn.limit }}<\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ qn.optional }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;color:#7A6A5E;background:#FFFFFF;border:1px solid #E7DBBE;padding:2px 10px;border-radius:999px\">Optional<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n          <\u002Fsection>\n\n          <section style=\"display:flex;flex-direction:column;gap:12px;padding:20px 24px 24px;border-top:1px solid #F0E6D0;background:#FDFAF4\">\n            <h3 style=\"font-family:'Work Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#7A6A5E;margin:0\">Interview process<\u002Fh3>\n            <sc-if value=\"{{ uni.byFaculty }}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;line-height:1.6;color:#4A3A31;margin:0\">It depends on the faculty. Some hold interviews or tests and others don't, so check your faculty's admissions page.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ uni.hasSteps }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <sc-for list=\"{{ uni.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <div style=\"font-family:'Work Sans',sans-serif;font-size:14.5px;font-weight:600;color:#8C151B\">{{ st.title }}<\u002Fdiv>\n                    <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px\">\n                      <sc-for list=\"{{ st.points }}\" as=\"pt\" hint-placeholder-count=\"2\">\n                        <li style=\"display:flex;gap:10px;align-items:flex-start;font-family:'Work Sans',sans-serif;font-size:14px;color:#4A3A31;line-height:1.55\">\n                          <span style=\"flex-shrink:0;width:5px;height:5px;border-radius:50%;background:#D6A017;margin-top:9px\"><\u002Fspan>\n                          <span>{{ pt }}<\u002Fspan>\n                        <\u002Fli>\n                      <\u002Fsc-for>\n                    <\u002Ful>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <section aria-labelledby=\"course-sharings-h\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <h2 id=\"course-sharings-h\" style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.375rem;font-weight:700;margin:0;color:#241A15\">Course sharings by university<\u002Fh2>\n        <p style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.55;color:#4A3A31;margin:0;text-wrap:pretty\">Slides from talks universities have given about their courses. Search for a course or pick a university, then open the slides. Admission figures can change each year, so check the university's website for the latest.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px;background:#FFFFFF;border:1px solid #E7DBBE;border-radius:14px;box-shadow:0 2px 6px rgba(36,26,21,0.08)\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <label for=\"cs-search\" style=\"font-family:'Work Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#7A6A5E\">Search by course or university<\u002Flabel>\n          <input id=\"cs-search\" type=\"search\" value=\"{{ cs.q }}\" onChange=\"{{ cs.onSearch }}\" placeholder=\"e.g. Pharmacy, Computing, Law\" autocomplete=\"off\" style=\"font-family:'Work Sans',sans-serif;font-size:15px;color:#241A15;padding:10px 14px;min-height:44px;border:1px solid #CFC1A3;border-radius:10px;background:#FBF7EF;box-sizing:border-box;width:100%\">\n        <\u002Fdiv>\n        <div role=\"group\" aria-label=\"Filter by university\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ cs.chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button type=\"button\" aria-pressed=\"{{ c.pressed }}\" onClick=\"{{ c.onClick }}\" style=\"font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;padding:8px 16px;min-height:40px;white-space:nowrap;border-radius:999px;cursor:pointer;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ cs.hasResults }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <sc-for list=\"{{ cs.groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <h3 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.2rem;font-weight:700;margin:0;color:#8C151B\">{{ g.uni }}<\u002Fh3>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px\">\n                <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                  <article style=\"display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:#FFFFFF;border:1px solid #E7DBBE;border-top:4px solid #D6A017;border-radius:12px\">\n                    <span style=\"font-family:'Work Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#8C650D\">{{ it.course }}<\u002Fspan>\n                    <h4 style=\"font-family:'Work Sans',sans-serif;font-size:16px;font-weight:700;line-height:1.35;margin:0;color:#241A15;text-wrap:pretty\">{{ it.title }}<\u002Fh4>\n                    <sc-if value=\"{{ it.hasNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                      <p style=\"font-family:'Work Sans',sans-serif;font-size:14px;line-height:1.55;color:#4A3A31;margin:0;flex:1\">{{ it.notes }}<\u002Fp>\n                    <\u002Fsc-if>\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px\">\n                      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                        <sc-if value=\"{{ it.hasDate }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span style=\"font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;color:#4A3A31;background:#F4ECDA;padding:3px 10px;border-radius:999px\">{{ it.date }}<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ it.hasType }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span style=\"font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;color:#7A6A5E;background:#FFFFFF;border:1px solid #E7DBBE;padding:2px 10px;border-radius:999px\">{{ it.type }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ it.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                        <a href=\"{{ it.link }}\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"{{ it.linkLabel }}: {{ it.title }}\" style=\"text-decoration:none;background:#8C151B;color:#FBF7EF;font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap\">{{ it.linkLabel }}&nbsp;↗<\u002Fa>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Farticle>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ cs.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.55;color:#4A3A31;margin:0;padding:16px 18px;background:#FFFFFF;border:1px dashed #CFC1A3;border-radius:12px\">{{ cs.emptyText }}<\u002Fp>\n      <\u002Fsc-if>\n\n      <a href=\"https://drive.google.com/drive/folders/1wy_IwvJ9JN83zbT-yvbN3jycTmr2yMKs\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;color:#8C151B;text-decoration:none;border-bottom:1px solid #D6A017;width:fit-content\">Browse every sharing in Google Drive ↗<\u002Fa>\n    <\u002Fsection>\n\n    <div style=\"display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:20px 22px;margin:8px 0 24px;background:#FBEACB;border:1px solid #E6B93A;border-radius:14px;box-sizing:border-box;width:100%\">\n  <span style=\"flex-shrink:0;width:44px;height:44px;border-radius:50%;background:#8C151B;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FBF7EF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n  <div style=\"flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px\">\n    <span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1.2rem;font-weight:700;color:#241A15;line-height:1.3\">Preparing for a university interview?<\u002Fspan>\n    <span style=\"font-family:'Work Sans',sans-serif;font-size:15px;color:#4A3A31;line-height:1.55\">Some courses shortlist applicants for interviews or aptitude-based assessments. Book a mock interview with <b>Ms Rachel Gong<\u002Fb>, our ECG Counsellor, to practise.<\u002Fspan>\n  <\u002Fdiv>\n  <a href=\"https://for.edu.sg/vjcecgcappointment\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"align-self:center;flex-shrink:0;text-decoration:none;background:#8C151B;color:#FBF7EF;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;padding:11px 18px;border-radius:8px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap\">Book a mock interview ↗<\u002Fa>\n<\u002Fdiv>\n<dc-import name=\"BottomNav\" active-key=\"sg-university-application\" hint-size=\"100%,200px\"><\u002Fdc-import>\n  <\u002Fmain>\n<\u002Fdiv>\n<div style=\"height:48px\"><\u002Fdiv>\n<dc-import name=\"Footer\" hint-size=\"100%,220px\"><\u002Fdc-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNqOpckArHPeU7bmvH7C-r1BVO7Y1VgDptif7mcXBQ_1yFJnaIMExRrurjTDOr6L8g0hrp7NVISFHL/pub?gid=0&single=true&output=csv';\nconst CACHE_KEY = 'vjc-ecg-local-uni-csv';\n\n// Course sharings: one row per sharing in the \"ECG Course Sharings\" Google Sheet.\n// Its \"Publish to web\" CSV link is below. If the sheet can't be reached, the list below is shown.\nconst SHARINGS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7BaaoJ07JcHvNTp_bI70NjkWbVxKu7sh8DvoTG-5MfQeGwi-D53ISUxvGVQKjVBctwDXWp2tdT7g5/pub?gid=1433683025&single=true&output=csv';\nconst SHARINGS_CACHE_KEY = 'vjc-ecg-course-sharings-csv';\nconst SHARINGS_FALLBACK = [\n  { uni: 'NUS', course: 'Pharmacy and Pharmaceutical Sciences', title: 'Introduction to Pharmacy & Pharmaceutical Science Programmes', date: '2 Oct 2026', type: 'Slides', link: 'https://drive.google.com/drive/folders/1BXIHv4kuWe3eFrHTyP8un56-iCNxqV8R', notes: 'The Bachelor of Pharmacy and the BSc in Pharmaceutical Science: what pharmacists do, the four-year curriculum, entry requirements and careers.' }\n];\nconst UNI_ORDER = ['NUS', 'NTU', 'SMU', 'SUTD', 'SIT', 'SUSS', 'UAS'];\n\nfunction splitLabel(s) {\n  s = String(s || '').trim();\n  const m = s.match(/^\\(([^)]+)\\)\\s*(.*)$/);\n  return m ? { tag: m[1].trim(), title: m[2].trim() } : { tag: '', title: s };\n}\nfunction toItems(s) {\n  return String(s || '').split(/\\n+/).map(x => x.replace(/^\\s*[-•·–]\\s*/, '').trim()).filter(Boolean);\n}\nfunction parseShift(rows) {\n  rows = rows.filter(r => r.some(x => String(x).trim()));\n  if (rows.length < 2) return null;\n  const head = rows[0];\n  const cols = head.map((x, i) => String(x).trim() ? i : -1).filter(i => i >= 0);\n  if (cols.length < 2) return null;\n  const [a, b] = cols.slice(-2);\n  const body = rows.slice(1);\n  const before = [], after = [];\n  let scope = '';\n  for (const r of body) {\n    if (!scope && String(r[0] || '').trim()) scope = String(r[0]).trim();\n    before.push(...toItems(r[a]));\n    after.push(...toItems(r[b]));\n  }\n  if (!before.length && !after.length) return null;\n  return { scope, hasScope: !!scope, before: { ...splitLabel(head[a]), items: before }, after: { ...splitLabel(head[b]), items: after } };\n}\n\nfunction parseCSV(text) {\n  const rows = []; let row = []; let cur = ''; let q = false;\n  for (let i = 0; i < text.length; i++) {\n    const ch = text[i];\n    if (q) {\n      if (ch === '\"' && text[i + 1] === '\"') { cur += '\"'; i++; }\n      else if (ch === '\"') q = false;\n      else cur += ch;\n    } else if (ch === '\"') q = true;\n    else if (ch === ',') { row.push(cur); cur = ''; }\n    else if (ch === '\\n' || ch === '\\r') {\n      if (ch === '\\r' && text[i + 1] === '\\n') i++;\n      row.push(cur); rows.push(row); row = []; cur = '';\n    } else cur += ch;\n  }\n  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }\n  return rows.filter(r => r.some(c => c.trim() !== ''));\n}\n\nconst clean = s => s.replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/g, '').replace(/[ \\t]+/g, ' ').trim();\n\nfunction readLimit(text) {\n  let optional = /optional/i.test(text);\n  let limit = '';\n  const m = text.match(/\\(([^()]*(?:characters?|words?|optional)[^()]*)\\)\\s*$/i);\n  let body = text;\n  if (m) {\n    body = text.slice(0, m.index).trim();\n    const inner = m[1];\n    const n = inner.match(/(\\d[\\d,]*)\\s*(characters?|words?)/i);\n    if (n) limit = (/max|not more|or less/i.test(inner) ? 'Up to ' : '') + n[1] + ' ' + (n[2].toLowerCase().startsWith('char') ? 'characters' : 'words');\n  }\n  if (!limit) {\n    const n = body.match(/in\\s+(\\d[\\d,]*)\\s+(words?|characters?)\\s+or\\s+less/i);\n    if (n) limit = 'Up to ' + n[1] + ' ' + (n[2].toLowerCase().startsWith('char') ? 'characters' : 'words');\n  }\n  return { body, limit, optional };\n}\n\nfunction parseQuestions(raw) {\n  const text = clean(raw.replace(/\\r/g, ''));\n  const numbered = text.split(/\\n?\\s*(?=\\b\\d+\\)\\s)/).map(s => s.trim()).filter(Boolean);\n  if (numbered.length > 1 || /^\\d+\\)\\s/.test(text)) {\n    return { intro: '', questions: numbered.filter(s => /^\\d+\\)\\s/.test(s)).map((s, i) => {\n      const { body, limit, optional } = readLimit(s.replace(/^\\d+\\)\\s*/, '').replace(/\\s+/g, ' '));\n      return { num: String(i + 1), text: body, limit, hasLimit: !!limit, optional };\n    }) };\n  }\n  const paras = text.split(/\\n\\s*\\n+/).map(p => p.replace(/\\s+/g, ' ').trim()).filter(Boolean);\n  const prompt = paras.pop() || '';\n  const { body, limit, optional } = readLimit(prompt);\n  return { intro: paras.join(' '), questions: [{ num: '1', text: body, limit, hasLimit: !!limit, optional }] };\n}\n\nfunction parseInterview(raw) {\n  const text = clean(raw.replace(/\\r/g, ''));\n  if (!text || /^depends on (the )?faculty\\.?$/i.test(text)) return { byFaculty: true, steps: [] };\n  const steps = [];\n  text.split('\\n').map(l => l.trim()).filter(Boolean).forEach(line => {\n    if (/^[-•●·–*]/.test(line)) {\n      const pt = line.replace(/^[-•●·–*]\\s*/, '').trim();\n      if (!steps.length) steps.push({ title: 'Overview', points: [] });\n      const t = pt.charAt(0).toUpperCase() + pt.slice(1);\n      steps[steps.length - 1].points.push(t);\n    } else {\n      steps.push({ title: line.replace(/:$/, '').replace(/\\bAssesment\\b/i, 'Assessment'), points: [] });\n    }\n  });\n  return { byFaculty: false, steps: steps.filter(s => s.points.length || s.title) };\n}\n\nclass Component extends DCLogic {\n  state = { status: 'loading', unis: [], active: 0, sharings: SHARINGS_FALLBACK, csUni: 'All', csQ: '' };\n\n  componentDidMount() {\n    try { const cached = localStorage.getItem(CACHE_KEY); if (cached) this.applySheet(cached); } catch (e) {}\n    this.loadSheet();\n    this.loadSharings();\n    this._timer = setInterval(() => this.loadSheet(), 120000);\n    this._onVis = () => { if (document.visibilityState === 'visible') this.loadSheet(); };\n    document.addEventListener('visibilitychange', this._onVis);\n  }\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    document.removeEventListener('visibilitychange', this._onVis);\n  }\n\n  async loadSheet() {\n    for (let attempt = 0; attempt < 3; attempt++) {\n      try {\n        const ctrl = new AbortController();\n        const t = setTimeout(() => ctrl.abort(), 10000);\n        const res = await fetch(SHEET_URL + '&_t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });\n        clearTimeout(t);\n        if (!res.ok) throw new Error('HTTP ' + res.status);\n        const text = await res.text();\n        if (text === this._lastText) return;\n        try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}\n        this.applySheet(text);\n        return;\n      } catch (e) {\n        if (attempt < 2) await new Promise(r => setTimeout(r, 1500));\n      }\n    }\n    if (!this.state.unis.length) this.setState({ status: 'error' });\n  }\n\n  applySheet(text) {\n    this._lastText = text;\n    try {\n      const all = parseCSV(text);\n      let hi = all.findIndex(row => row.some(x => /aptitude|essay|question/i.test(x)) && row.some(x => /interview/i.test(x)));\n      if (hi < 0) hi = 0;\n      this._shift = parseShift(all.slice(0, hi));\n      const rows = all.slice(hi);\n      const h = rows[0].map(x => x.trim().toLowerCase());\n      const iName = 0;\n      const iEntry = h.findIndex(x => /entry|year|intake/.test(x));\n      const iQ = h.findIndex(x => /question|essay|aptitude/.test(x));\n      const iInt = h.findIndex(x => /interview/.test(x));\n      const cell = (r, i) => (i >= 0 && r[i] ? r[i] : '');\n      const unis = rows.slice(1).map(r => {\n        const name = clean(cell(r, iName));\n        if (!name) return null;\n        const q = parseQuestions(cell(r, iQ));\n        const iv = parseInterview(cell(r, iInt));\n        const entry = clean(cell(r, iEntry));\n        return { name, entry, intro: q.intro, questions: q.questions, byFaculty: iv.byFaculty, steps: iv.steps };\n      }).filter(Boolean);\n      this.setState(s => ({ status: 'ready', unis, shift: this._shift, active: Math.min(s.active, Math.max(unis.length - 1, 0)) }));\n    } catch (e) {\n      if (!this.state.unis.length) this.setState({ status: 'error' });\n    }\n  }\n\n  async loadSharings() {\n    if (!SHARINGS_SHEET_URL) return;\n    try { const cached = localStorage.getItem(SHARINGS_CACHE_KEY); if (cached) this.applySharings(cached); } catch (e) {}\n    try {\n      const res = await fetch(SHARINGS_SHEET_URL + '&_t=' + Date.now(), { cache: 'no-store' });\n      if (!res.ok) return;\n      const text = await res.text();\n      try { localStorage.setItem(SHARINGS_CACHE_KEY, text); } catch (e) {}\n      this.applySharings(text);\n    } catch (e) {}\n  }\n\n  applySharings(text) {\n    try {\n      const rows = parseCSV(text);\n      if (rows.length < 2) return;\n      const h = rows[0].map(x => clean(x).toLowerCase());\n      const col = re => h.findIndex(x => re.test(x));\n      const iU = col(/univ/), iC = col(/course/), iT = col(/title/), iD = col(/date/), iY = col(/type/), iL = col(/link|url/), iN = col(/note|desc/), iS = col(/show/);\n      const cell = (r, i) => (i >= 0 && r[i] ? clean(r[i]) : '');\n      const list = rows.slice(1).map(r => ({\n        uni: cell(r, iU), course: cell(r, iC), title: cell(r, iT), date: cell(r, iD),\n        type: cell(r, iY), link: cell(r, iL), notes: cell(r, iN), show: cell(r, iS)\n      })).filter(x => (x.title || x.course) && x.uni && !/^no$/i.test(x.show));\n      this.setState({ sharings: list });\n    } catch (e) {}\n  }\n\n  sharingVals() {\n    const { sharings, csUni, csQ } = this.state;\n    const q = csQ.trim().toLowerCase();\n    const rank = u => { const i = UNI_ORDER.indexOf(u.toUpperCase()); return i < 0 ? 99 : i; };\n    const unis = [...new Set(sharings.map(s => s.uni))].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));\n    const matchQ = s => !q || [s.uni, s.course, s.title, s.notes].join(' ').toLowerCase().includes(q);\n    const searched = sharings.filter(matchQ);\n    const shown = searched.filter(s => csUni === 'All' || s.uni === csUni);\n    const chip = (label, key, n) => {\n      const on = csUni === key;\n      return { label: label + ' (' + n + ')', pressed: on ? 'true' : 'false', bg: on ? '#8C151B' : '#FFFFFF', color: on ? '#FBF7EF' : '#4A3A31', border: on ? '#8C151B' : '#E7DBBE', onClick: () => this.setState({ csUni: key }) };\n    };\n    const chips = [chip('All', 'All', searched.length)].concat(unis.map(u => chip(u, u, searched.filter(s => s.uni === u).length)));\n    const verb = t => /video/i.test(t) ? 'Watch video' : /slide/i.test(t) ? 'Open slides' : 'Open';\n    const groups = unis.map(u => ({\n      uni: u,\n      items: shown.filter(s => s.uni === u).sort((a, b) => a.course.localeCompare(b.course) || a.title.localeCompare(b.title)).map(s => ({\n        course: s.course, title: s.title || s.course, notes: s.notes, hasNotes: !!s.notes,\n        date: s.date, hasDate: !!s.date, type: s.type, hasType: !!s.type,\n        link: s.link, hasLink: /^https?:\\/\\//.test(s.link), linkLabel: verb(s.type)\n      }))\n    })).filter(g => g.items.length);\n    const where = csUni === 'All' ? '' : ' for ' + csUni;\n    return {\n      q: csQ,\n      onSearch: e => this.setState({ csQ: e.target.value }),\n      chips, groups,\n      hasResults: groups.length > 0,\n      isEmpty: groups.length === 0,\n      emptyText: q ? 'No sharings match “' + csQ.trim() + '”' + where + ' yet. Try another course, or browse every sharing in Google Drive.' : 'No sharings' + where + ' yet. Check back soon.'\n    };\n  }\n\n  renderVals() {\n    const { status, unis, active } = this.state;\n    const sh = this.state.shift;\n    const u = unis[active] || { name: '', entry: '', intro: '', questions: [], byFaculty: true, steps: [] };\n    return {\n      isLoading: status === 'loading',\n      hasError: status === 'error',\n      isReady: status === 'ready' && unis.length > 0,\n      cs: this.sharingVals(),\n      hasShift: !!sh,\n      shift: sh || { scope: '', hasScope: false, before: { tag: '', title: '', items: [] }, after: { tag: '', title: '', items: [] } },\n      tabs: unis.map((x, i) => {\n        const on = i === active;\n        return {\n          label: x.name, selected: on ? 'true' : 'false',\n          bg: on ? '#8C151B' : '#FFFFFF', color: on ? '#FBF7EF' : '#4A3A31', border: on ? '#8C151B' : '#E7DBBE',\n          onClick: () => this.setState({ active: i })\n        };\n      }),\n      uni: {\n        name: u.name,\n        entryLabel: u.entry ? 'For ' + u.entry + ' entry' : '', hasEntry: !!u.entry,\n        intro: u.intro, hasIntro: !!u.intro,\n        questions: u.questions,\n        byFaculty: u.byFaculty, hasSteps: !u.byFaculty && u.steps.length > 0,\n        steps: u.steps\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
